# Checks every change to the Assessor Portal, and publishes it only when every check passes (22 Nov 2026).
# See README, "How this is updated". Pages' source is GitHub Actions: a change that fails a check is
# not published, and the page stays as it was until the next change passes.
name: Checks and Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install the checking tools
        run: |
          npm install --no-save --no-audit --no-fund acorn@8.12.1 acorn-walk@8.3.4 playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Every script parses, and no function is defined twice
        run: node tests/check-scripts.js
      - name: Nothing private in the public page
        if: ${{ always() }}
        run: python3 tests/check-public.py
      - name: Click through the whole portal with a made-up firm
        if: ${{ always() }}
        run: node tests/click-through.js

  # Publish to resources.mismo.org/assessors/ only after every check above passed, and only from main.
  publish:
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package the page exactly as it is in the repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
