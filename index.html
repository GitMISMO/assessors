<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MISMO Assessor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="portal.css">
<style>
/* ── The assessor portal's own layer ────────────────────────────────────────
   Everything above comes from portal.css, the Service Orders stylesheet copied
   across unchanged. Only what is new to this page is declared here, prefixed
   as- so it can never collide with the chassis.

   The shape follows the Certification Management System: a scannable list of
   cards, and one record at a time in a panel on the right with labelled
   sections. Nothing expands inline, because an engagement carries a twenty-odd
   question questionnaire and inline expansion turns the list into a mile of
   scroll where you cannot tell what is what. */

/* Tags are rectangles here, not pills. */
.chip, .as-tag{border-radius:3px}
.as-tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);
  font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;
  padding:2px 7px;border-radius:3px;background:var(--surface-3);color:var(--ink-2);
  white-space:nowrap}
.as-tag.you{background:rgba(162,112,26,.16);color:var(--warn)}
.as-tag.good{background:rgba(15,123,92,.13);color:var(--good)}
.as-tag.bad{background:rgba(179,55,44,.12);color:var(--bad)}
.as-tag.cool{background:var(--surface-3);color:var(--ink-2)}

.as-wrap{padding:26px 30px 90px}
.as-doccyc{margin:14px 0 4px;font-size:13px;color:var(--ink)}
.as-doccyc span{color:var(--ink-3);font-size:12px;margin-left:6px}
.as-docs{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
.as-docs li{padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;overflow-wrap:anywhere}
.as-docs li small{color:var(--ink-3);margin-left:6px;white-space:nowrap}
.as-pane{display:none}
.as-pane.on{display:block}
.as-h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.014em;
  color:var(--ink);margin:0 0 4px}
.as-asof{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-3);
  margin:0 0 22px;font-variant-numeric:tabular-nums}
.as-lede{font-family:var(--display);font-size:13.5px;color:var(--ink-2);line-height:1.6;
  margin:0 0 20px}

/* ── The board, copied from the Certification Management System ────────────
   The CMS already shows MISMO what a firm's portal looks like, and that preview
   is the agreed design. These rules are the same rules, so the two pages do not
   drift: the navy headline card with four tiles, then one panel per section with
   a real table inside it. The only deliberate difference is that tags here are
   rectangles rather than pills. */

.asb-head{background:var(--navy,#0d314c);color:#fff;border-radius:8px;padding:20px 22px;
  display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.asb-head .hl-date{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--sky-soft,#a8d8f2)}
.hl-body{display:flex;flex-direction:column;gap:14px}
.asb-say{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.35;color:#fff}
.asb-say em{font-style:normal}
.asb-say em.hl-late{color:#ffcf73}
.hl-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.as-sub{margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--border)}
.as-sub h3{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--ink)}
.as-sub .psub{margin:0}
@media (max-width:1100px){.hl-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.hl-tiles{grid-template-columns:1fr}}
.hl-tile{background:rgba(255,255,255,.07);border:1px solid rgba(116,191,235,.28);
  border-radius:6px;padding:12px 14px;display:block;width:100%;text-align:left}
.hl-tile b{display:block;font-size:28px;font-weight:700;line-height:1.1;color:#fff;
  font-variant-numeric:tabular-nums}
.hl-tile span{display:block;font-size:12px;color:var(--sky-soft,#a8d8f2);margin-top:3px}
.hl-tile small{display:block;font-size:11.5px;color:rgba(255,255,255,.6);margin-top:2px}
.hl-tile.warn b{color:#ffcf73}

.asb-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:20px 22px;margin-bottom:28px}
.asb-panel h2{font-family:var(--display);font-size:21.75px;font-weight:600;letter-spacing:-.012em;
  line-height:1.55;color:var(--ink);margin:0}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.phead>div:first-child{flex:1 1 420px;min-width:0}
.asb-panel .psub{font-size:12.5px;line-height:1.55;color:var(--ink-3);margin:4px 0 16px}

.etable{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.ehead,.erow{display:grid;grid-template-columns:2fr 1fr 1.3fr .8fr .7fr auto;gap:14px;
  align-items:center;padding:10px 15px;text-align:left}
.ehead{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:700;color:var(--ink-3);background:var(--surface-3);
  border-bottom:1px solid var(--border-strong)}
.erow{width:100%;background:var(--surface);border:0;border-bottom:1px solid var(--rule,var(--border));
  font:inherit;font-family:var(--display);font-size:13px;color:var(--ink);cursor:pointer}
.erow:last-child{border-bottom:0}
.erow:hover{background:var(--surface-2)}
.erow:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.erow.mine{box-shadow:inset 3px 0 0 var(--c3,#0f7b5c)}
.erow.flat{cursor:default}
.erow.flat:hover{background:var(--surface)}
.erow .num,.ehead .num{text-align:right;font-variant-numeric:tabular-nums}
.ehead.coming,.erow.coming{grid-template-columns:2fr 1fr 1.4fr}
.e-co{font-weight:600;min-width:0}
.e-pr{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3);margin-top:1px}
.e-sub{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.e-sub.bad{color:var(--bad);font-weight:600}
.e-pg,.e-st,.e-sc,.e-fee{min-width:0}
.e-go{font-size:11.5px;font-weight:600;color:var(--navy-mid,#14486e);white-space:nowrap;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:860px){
  .ehead{display:none}
  .erow{grid-template-columns:1fr auto;row-gap:4px;padding:12px 14px}
  .erow .e-pg,.erow .e-st{grid-column:1}
  .erow .e-sc,.erow .e-fee{grid-column:2;text-align:right}
  .erow .e-co{grid-column:1 / -1}
  .erow .e-go{grid-column:1 / -1;padding-top:2px}
  .erow.coming{grid-template-columns:1fr auto;row-gap:3px}
  .erow.coming .e-co{grid-column:1 / -1}
  .erow.coming .e-st{text-align:right}
}

table.av{width:100%;border-collapse:collapse;margin:0 0 12px;font-family:var(--display);
  font-size:13px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
table.av th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:7px 12px;
  background:var(--surface-3);border-bottom:1px solid var(--border-strong)}
table.av td{padding:9px 12px;border-bottom:1px solid var(--rule,var(--border));color:var(--ink)}
table.av tr:last-child td{border-bottom:0}
table.av td:first-child{font-weight:600;white-space:nowrap}

.prog-facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.fact{font-size:11.5px;color:var(--ink-2);background:var(--chip,var(--surface-3));
  border-radius:3px;padding:3px 10px}
.fact.no{color:var(--ink-3);border:1px dashed var(--border-strong);background:transparent;
  text-decoration:line-through;text-decoration-color:var(--bad)}

.asb-empty{border:1px dashed var(--border-strong);border-radius:8px;padding:26px 20px;
  text-align:center;color:var(--ink-3);font-family:var(--display);font-size:13px;
  background:var(--surface-2)}
.as-empty{border:1px dashed var(--border-strong);border-radius:9px;padding:34px 24px;
  text-align:center;color:var(--ink-3);font-family:var(--display);font-size:13.5px;
  background:var(--surface-2)}
.as-bad{border:1px solid var(--bad);border-radius:8px;background:rgba(179,55,44,.08);
  color:var(--bad);font-family:var(--display);font-size:13px;padding:12px 14px;margin-bottom:18px}

/* The panel on the right, one engagement at a time */
.as-panel{position:fixed;top:0;right:0;bottom:0;width:min(680px,calc(100vw - 56px));z-index:121;
  background:var(--ground);border-left:1px solid var(--border-strong);
  box-shadow:-10px 0 34px rgba(6,32,47,.28);display:none;flex-direction:column}
.as-panel.on{display:flex}
.as-panel.wide{width:min(1100px,calc(100vw - 56px))}
.as-scrim{position:fixed;inset:0;z-index:120;background:rgba(6,32,47,.42);border:0;padding:0;display:none}
.as-scrim.on{display:block}
.as-ph{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;background:var(--surface);
  border-bottom:1px solid var(--border);flex:0 0 auto}
.as-ph h3{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.012em;
  color:var(--ink);margin:0;line-height:1.25;overflow-wrap:anywhere}
.as-ph .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px;
  overflow-wrap:anywhere}
.as-ph .acts{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.as-ic{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--border-strong);border-radius:5px;
  color:var(--ink-2);cursor:pointer;padding:0}
.as-ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.as-ic:hover{background:var(--surface-3);color:var(--ink)}
.as-ic:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.as-pb{overflow:auto;padding:0 20px 70px;flex:1 1 auto}

/* A section inside the panel: shut by default, opens on a click on its heading */
.as-sec{border-bottom:1px solid var(--rule,var(--border))}
.as-sh{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;
  border:0;padding:15px 0;font:inherit;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--ink-2);
  cursor:pointer}
.as-sh:hover{color:var(--ink)}
.as-sh:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.as-sh .cv{width:13px;height:13px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;color:var(--ink-3);transition:transform .15s ease}
.as-sec.open .as-sh .cv{transform:rotate(90deg)}
.as-sh .cnt{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
  letter-spacing:.06em;font-variant-numeric:tabular-nums}
.as-sb{display:none;padding:0 0 20px}
.as-sec.open .as-sb{display:block}
.as-sec.always .as-sb{display:block}

.as-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:15px 22px}
.as-k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;color:var(--ink-3);margin-bottom:2px}
.as-v{font-family:var(--display);font-size:14px;font-weight:500;color:var(--ink);
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.as-v.none{color:var(--ink-3);font-weight:400}
.as-note{font-family:var(--display);font-size:12.5px;color:var(--ink-3);margin:14px 0 0}

/* The questionnaire, one closed block per section of the form */
.as-qsec{border:1px solid var(--border);border-radius:7px;background:var(--surface);
  margin-bottom:8px;overflow:hidden}
.as-qh{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;
  border:0;padding:11px 13px;font:inherit;font-family:var(--display);font-size:13px;
  font-weight:600;color:var(--ink);cursor:pointer}
.as-qh:hover{background:var(--surface-2)}
.as-qh:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.as-qh .cv{width:12px;height:12px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;color:var(--ink-3);transition:transform .15s ease}
.as-qsec.open .as-qh .cv{transform:rotate(90deg)}
.as-qh .cnt{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.as-qb{display:none;padding:2px 13px 10px;border-top:1px solid var(--rule,var(--border))}
.as-qsec.open .as-qb{display:block}
.as-qa{margin:0;padding:0;list-style:none}
.as-qa li{padding:10px 0;border-bottom:1px solid var(--rule,var(--border))}
.as-qa li:last-child{border-bottom:0}
.as-qa .q{font-family:var(--display);font-size:12px;font-weight:600;color:var(--ink-2);
  margin-bottom:3px}
.as-qa .a{font-family:var(--display);font-size:13px;color:var(--ink);line-height:1.55;
  overflow-wrap:anywhere;white-space:pre-wrap}
.as-qa .a.none{color:var(--ink-3);font-style:italic}

.as-hist div{padding:9px 0;border-bottom:1px solid var(--rule,var(--border));
  font-family:var(--display);font-size:13px;color:var(--ink)}
.as-hist div:last-child{border-bottom:0}
.as-hist b{font-weight:600}
.as-hist span{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:8px;
  font-variant-numeric:tabular-nums}

/* Recording a finding */
.as-find label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 4px}
.as-f{margin-bottom:13px}
.as-find select, .as-find textarea{width:100%;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:5px;color:var(--ink);font:inherit;
  font-family:var(--display);font-size:13px;padding:9px 10px}
.as-find textarea{min-height:98px;resize:vertical;line-height:1.55}
.as-find select:focus, .as-find textarea:focus{outline:2px solid var(--sky);outline-offset:-1px}
.as-go{background:var(--navy,#0d314c);color:#fff;border:0;border-radius:5px;padding:10px 18px;
  font:inherit;font-family:var(--display);font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;min-width:max-content}
.as-go:hover:not(:disabled){background:var(--navy-mid,#14486e)}
.as-go:disabled{opacity:.45;cursor:not-allowed}
.as-go.ghost{background:transparent;color:var(--ink);border:1px solid var(--border-strong)}
.as-go.ghost:hover:not(:disabled){background:var(--surface-3)}
table.av select, table.av input{font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--border-strong);border-radius:5px;background:var(--surface);color:var(--ink)}
.as-go:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.as-say{font-family:var(--display);font-size:12.5px;margin-left:12px}
.as-say.ok{color:var(--good)}
.as-say.bad{color:var(--bad)}
.as-one{border:1px solid var(--border);border-radius:6px;background:var(--surface);
  padding:11px 13px;margin-bottom:8px}
.as-one p{margin:7px 0 0;font-family:var(--display);font-size:13px;color:var(--ink);
  line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.as-when{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* Help */
.as-help h3{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.008em;
  color:var(--ink);margin:30px 0 7px}
.as-help h3:first-child{margin-top:0}
.as-help p{font-family:var(--display);font-size:13.5px;color:var(--ink-2);line-height:1.65;
  margin:0 0 11px}
.as-help ul{margin:0 0 13px;padding-left:19px}
.as-help li{font-family:var(--display);font-size:13.5px;color:var(--ink-2);line-height:1.65;
  margin-bottom:6px}
.as-help b{color:var(--ink);font-weight:600}
.as-help .as-box{border:1px solid var(--border);border-left:3px solid var(--sky,#74bfeb);
  border-radius:7px;background:var(--surface);padding:13px 15px;margin:0 0 15px}
.as-help .as-box p:last-child{margin-bottom:0}
.as-help table{width:100%;border-collapse:collapse;margin:0 0 15px;
  font-family:var(--display);font-size:13px}
.as-help th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:7px 10px;
  background:var(--surface-3);border-bottom:1px solid var(--border-strong)}
.as-help td{padding:9px 10px;border-bottom:1px solid var(--rule,var(--border));
  color:var(--ink-2);vertical-align:top}
.as-help td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}

.as-sign-out{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;
  border-radius:5px;padding:5px 10px;font:inherit;font-family:var(--display);font-size:11.5px;
  cursor:pointer;white-space:nowrap;min-width:max-content}
.as-sign-out:hover{background:rgba(255,255,255,.18)}

/* .hq.rail sets display:flex, which beats the browser's own rule for [hidden],
   so the rail has to be told explicitly to go away when it is hidden. */
.hq.rail[hidden]{display:none}
body.as-noshell{padding-left:0}
body.as-noshell .hqtop{margin-left:0;width:100%}
body.as-noshell .railscrim{display:none}

/* ══ The 31 Oct 2026 portal (Jonna: "10x ... wowing, very cool visually and engaging, organized,
   easy to understand the process, intuitive"). Squared shapes, figure boxes first, one page per
   tab, nothing folded away. ══════════════════════════════════════════════════════════════════ */
.as-wrap{padding:26px 30px 90px;max-width:1280px}
.hq nav button[hidden]{display:none}
.mono{width:38px;height:38px;flex:0 0 38px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:14px;letter-spacing:.02em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:3px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.tag.soft{background:transparent;border:1px solid var(--border);color:var(--ink-3)}
.tag.cal{background:rgba(116,191,235,.18);color:var(--navy-mid)}
.fine{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin:10px 0}
.calm{border:1px dashed var(--border-strong);border-radius:8px;padding:22px;text-align:center;color:var(--ink-2);font-size:13.5px;background:var(--surface-2)}
.calm b{color:var(--ink)}

/* the hero */
.hx{position:relative;overflow:hidden;border-radius:10px;padding:28px 28px 24px;margin-bottom:26px;color:#fff;
  background:radial-gradient(1200px 300px at 100% -20%,rgba(116,191,235,.35),transparent 60%),
    radial-gradient(600px 260px at -10% 120%,rgba(116,191,235,.18),transparent 60%),
    linear-gradient(135deg,var(--navy-deep,#06202f) 0%,var(--navy,#0d314c) 55%,var(--navy-mid,#14486e) 100%);
  box-shadow:0 10px 30px rgba(6,32,47,.25)}
.hx:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
  background-image:linear-gradient(rgba(255,255,255,.9) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.9) 1px,transparent 1px);
  background-size:28px 28px;mask-image:linear-gradient(90deg,transparent,#000 60%)}
.hx-top{position:relative;z-index:1}
.hx-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sky)}
.hx-name{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:6px 0 8px;color:#fff}
.hx-say{font-size:16.5px;line-height:1.5;color:rgba(255,255,255,.88);margin:0 0 20px;max-width:900px}
.hx-say em{font-style:normal;color:var(--sky);font-weight:700}
.hx-say em.hl-late{color:#ffcf73}
.hx-tiles{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hx-tile{text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(116,191,235,.3);border-radius:8px;padding:14px 16px;
  color:#fff;font:inherit;cursor:pointer;transition:transform .15s ease,background .15s ease,border-color .15s ease}
.hx-tile:hover{background:rgba(255,255,255,.13);border-color:var(--sky);transform:translateY(-2px)}
.hx-tile b{display:block;font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.hx-tile span{display:block;font-size:12.5px;color:var(--sky);margin-top:4px;font-weight:600}
.hx-tile small{display:block;font-size:11.5px;color:rgba(255,255,255,.62);margin-top:2px}
.hx-tile.warn b{color:#ffcf73}
.hx-tile.next b{font-size:22px;padding-top:6px}
@media(max-width:900px){.hx-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.hx-name{font-size:24px}}

/* sections of a page */
.ov-sec{margin:0 0 30px}
.ov-h{margin:0 0 12px}
.ov-h h2,.pg-h h1{font-size:19px;font-weight:700;letter-spacing:-.012em;color:var(--ink);margin:0}
.pg-h h1{font-size:24px}
.ov-h p,.pg-h p{font-size:13px;color:var(--ink-3);margin:4px 0 0;line-height:1.5;max-width:900px}
.pg-h{margin:0 0 18px}

/* the next moves */
.moves{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.move{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--border);
  border-left:4px solid #e0a83c;border-radius:8px;padding:16px;font:inherit;color:var(--ink);cursor:pointer;
  box-shadow:0 1px 2px rgba(6,32,47,.05);transition:transform .15s ease,box-shadow .15s ease}
.move:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(6,32,47,.12)}
.mv-top{display:flex;gap:11px;align-items:center}
.mv-id{min-width:0}.mv-id b{display:block;font-size:15px}.mv-id i{display:block;font-style:normal;font-size:12px;color:var(--ink-3);margin-top:1px}
.mv-k{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--warn)}
.mv-do b{display:block;font-size:15px;margin-top:2px}
.mv-foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mv-go{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--navy-mid)}
.mv-go svg,.er-go svg{width:14px;height:14px}

/* the journey: stepper, mini stepper, map, bar */
.jstep{display:flex;gap:0;margin:4px 0 16px}
.js{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;min-width:0}
.js:before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:3px;background:var(--border)}
.js:first-child:before{display:none}
.js.past:before,.js.now:before{background:var(--good)}
.jd{position:relative;z-index:1;width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;background:var(--surface-3);color:var(--ink-3);border:2px solid var(--border)}
.js.past .jd{background:var(--good);border-color:var(--good);color:#fff}
.js.now .jd{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 0 0 4px rgba(116,191,235,.35)}
.js.now.mine .jd{background:#e0a83c;border-color:#e0a83c;color:#2a1d05;box-shadow:0 0 0 4px rgba(224,168,60,.3)}
.js b{font-size:11px;font-weight:600;color:var(--ink-3);line-height:1.25}
.js.now b{color:var(--ink)}
.jstep.mini{margin:0}.jstep.mini .jd{width:16px;height:16px;font-size:0;border-width:2px;border-radius:4px}
.jstep.mini .js:before{top:7px;height:2px}.jstep.mini b{display:none}
.jstep.mini .js.now b{display:block;font-size:10.5px;white-space:nowrap}
.jmap{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:4px}
.jm{flex:1 1 0;min-width:118px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:14px 13px;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s,transform .15s}
.jm:hover{border-color:var(--sky);transform:translateY(-2px)}
.jm.you{border-top:3px solid var(--sky)}
.jm.hot{border-top-color:#e0a83c;box-shadow:0 0 0 1px rgba(224,168,60,.35) inset}
.jm-n{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.jm-t{font-size:13px;font-weight:700;margin-top:6px}
.jm-w{font-size:11px;color:var(--ink-3);line-height:1.35}
.jm-me{font-size:10.5px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.jm-arrow{flex:0 0 14px;align-self:center;height:2px;background:var(--border-strong);position:relative}
.jm-arrow:after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--border-strong)}
.jb{display:flex;gap:3px;width:100%}
.jb i{flex:1;height:6px;border-radius:2px;background:var(--surface-3)}
.jb i.past{background:var(--good)}
.jb i.now{background:var(--navy-mid)}
.jb i.now.mine{background:#e0a83c}

/* coming up */
.agenda{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.ag{display:flex;align-items:center;gap:13px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:10px 14px;font:inherit;color:var(--ink);cursor:pointer}
.ag:hover{border-color:var(--sky)}
.dtile{flex:0 0 54px;display:flex;flex-direction:column;align-items:center;border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.dtile i{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;width:100%;text-align:center;padding:2px 0}
.dtile i:first-child{background:var(--navy);color:#fff}
.dtile b{font-size:20px;line-height:1.2;font-weight:700}
.ag-id{min-width:0;flex:1}.ag-id b{display:block;font-size:14px}.ag-id i{display:block;font-style:normal;font-size:12px;color:var(--ink-3)}
.ag-when{font-size:12px;font-weight:700;color:var(--navy-mid);white-space:nowrap}

/* engagements */
.toolbar{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;padding:7px 12px;border-radius:5px;border:1px solid var(--border);background:var(--surface);color:var(--ink-2);cursor:pointer}
.seg button b{font-variant-numeric:tabular-nums;color:var(--ink);margin-left:3px}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg button.on b{color:#fff}
.find{font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--border-strong);border-radius:5px;background:var(--surface);color:var(--ink);width:260px;max-width:100%}
.grp{margin:0 0 24px}
.grp-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 0 8px;border-bottom:2px solid var(--border);margin-bottom:8px}
.grp-h b{font-size:15px}
.grp-h span{font-size:12px;font-weight:700;background:var(--surface-3);border-radius:3px;padding:1px 7px;color:var(--ink-2)}
.grp-h i{font-style:normal;font-size:12.5px;color:var(--ink-3)}
.grp-h.you{border-bottom-color:#e0a83c}.grp-h.mismo{border-bottom-color:var(--bad)}.grp-h.queue{border-bottom-color:var(--sky)}
.ers{display:flex;flex-direction:column;gap:8px}
.er{display:grid;grid-template-columns:38px minmax(0,1.5fr) minmax(0,.9fr) minmax(0,1.4fr) minmax(0,1.4fr) 18px;gap:14px;align-items:center;
  text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer;
  transition:border-color .15s,box-shadow .15s}
.er:hover{border-color:var(--sky);box-shadow:0 6px 16px rgba(6,32,47,.08)}
.er.mine{border-left:4px solid #e0a83c}
.er-id b{display:block;font-size:14px}.er-id i,.er-jr i,.er-st i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin-top:3px;overflow-wrap:anywhere}
.er-pg{display:flex;gap:5px;flex-wrap:wrap}
.er-st b{display:block;font-size:13px}
.er-st.you b{color:var(--warn)}.er-st.bad b{color:var(--bad)}
.er-go{color:var(--ink-3)}
@media(max-width:900px){.er{grid-template-columns:38px 1fr 18px}.er-pg,.er-jr,.er-st{grid-column:2 / 3}}

/* schedule */
.wk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 6px}
.wk-d{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;min-height:110px;display:flex;flex-direction:column;gap:7px}
.wk-d>b{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.wk-w{display:block;background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:#fff;border-radius:5px;padding:8px 10px;font-weight:700;font-size:14px}
.wk-w i{display:block;font-style:normal;font-weight:500;font-size:11.5px;color:var(--sky)}
.wk-off{font-size:12px;color:var(--ink-3)}
@media(max-width:760px){.wk{grid-template-columns:repeat(2,minmax(0,1fr))}}
.aved{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px}
.aved h3{margin:0 0 12px;font-size:15px}
.avr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.avr select,.avr input{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:5px;background:var(--surface);color:var(--ink)}
.avr span{font-size:12.5px;color:var(--ink-3)}

/* the panel */
.as-ph{align-items:center}
.ptabs{display:flex;gap:2px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;flex:0 0 auto}
.ptabs button{font:inherit;font-size:13px;font-weight:600;color:var(--ink-3);background:none;border:0;border-bottom:3px solid transparent;padding:11px 10px;cursor:pointer;white-space:nowrap}
.ptabs button b{font-size:11px;background:var(--surface-3);color:var(--ink-2);border-radius:3px;padding:1px 6px;margin-left:3px}
.ptabs button.on{color:var(--ink);border-bottom-color:var(--sky)}
.as-pb{padding:18px 20px 70px}
.nextbox{border-radius:8px;padding:14px 16px;margin:0 0 16px;background:rgba(224,168,60,.12);border:1px solid rgba(224,168,60,.45)}
.nextbox b{display:block;font-size:17px;margin-top:3px;color:var(--ink)}
.nextbox i{display:block;font-style:normal;font-size:12.5px;color:var(--ink-2);margin-top:3px}
.nextbox.calmbox{background:var(--surface);border-color:var(--border)}
.nextbox.calmbox .mv-k{color:var(--ink-3)}
.as-sec.always{border-bottom:0}

/* documents */
.cyc{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:14px;margin:0 0 12px}
.cyc.now{border:2px solid var(--sky);box-shadow:0 6px 18px rgba(116,191,235,.18)}
.cyc-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.cyc-h b{font-size:15px}.cyc-h span{font-size:12px;color:var(--ink-3);font-weight:600}
.cyc-open{margin-left:auto;font-size:12px;font-weight:600;color:var(--navy-mid)}
.cyc-sub{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:20px 0 8px}
.dls{display:flex;flex-direction:column;gap:2px}
.dl{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:5px;text-decoration:none;color:var(--ink)}
.dl:hover{background:var(--surface-2)}
.dl-n{flex:1;min-width:0;font-size:13px;overflow-wrap:anywhere}
.dl-m{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.fi{flex:0 0 34px;height:22px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;color:#fff;background:#6c899f}
.fi-pdf{background:#b3372c}.fi-xls{background:#0f7b5c}.fi-doc{background:#2b5797}.fi-vid{background:#7a4fb3}.fi-img{background:#b5651d}.fi-msg{background:#14486e}
.drop{margin-top:12px;border:2px dashed var(--border-strong);border-radius:8px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--surface-2)}
.drop svg{width:26px;height:26px;fill:none;stroke:var(--navy-mid);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drop b{font-size:14px}.drop span{font-size:12px;color:var(--ink-3)}
.drop.over{border-color:var(--sky);background:rgba(116,191,235,.12)}
.upsay{font-size:12.5px;margin-top:8px;color:var(--ink-2)}.upsay.ok{color:var(--good)}.upsay.bad{color:var(--bad)}

/* view as */
.vabar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 30px;background:#5B3FA6;color:#fff}
.va-l{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#d9cdf7}
.va-c{font-weight:700;font-size:14px}.va-r{font-size:12.5px;color:#e6defb}
.va-ro{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:#ffcf73;color:#2a1d05;border-radius:3px;padding:3px 9px}
.va-out{font:inherit;font-size:12.5px;font-weight:700;background:#fff;color:#3F2A7A;border:0;border-radius:5px;padding:6px 12px;cursor:pointer}
.vas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.va-card{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;text-decoration:none;color:var(--ink)}
.va-card:hover{border-color:var(--sky)}
.va-card b{font-size:16px}.va-card span{font-size:12.5px;font-weight:700;color:var(--navy-mid)}
:root[data-theme="dark"] .tag.cal,:root[data-theme="dark"] .mv-go,:root[data-theme="dark"] .ag-when,:root[data-theme="dark"] .cyc-open,:root[data-theme="dark"] .va-card span{color:var(--sky)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.cal,:root:not([data-theme="light"]) .mv-go,:root:not([data-theme="light"]) .ag-when,:root:not([data-theme="light"]) .cyc-open,:root:not([data-theme="light"]) .va-card span{color:var(--sky)}}
</style>
</head>

<header class="hqtop">
  <span class="logoplate"><svg class="wordmark" role="img" aria-label="MISMO" viewBox="0 0 708 108"><use href="#mismo-logo"/></svg><svg class="santa" viewBox="0 0 100 100" aria-hidden="true"><use href="#mismo-hat"/></svg></span>
  <span class="mastrule"></span>
  <span class="hqname">Assessor Portal</span>
  <span class="hqtop-r"><span class="eyebrow-m">Programs &amp; Operations</span>
    <button class="as-sign-out" id="as-out" type="button" hidden>Sign Out</button></span>
</header>

<aside class="hq rail" id="rail" hidden>
  <div class="rail-top">
    <span class="rail-lbl">Sections</span>
    <button class="railhide" id="rail-hide" type="button" aria-label="Narrow the menu" title="Narrow the menu (backslash)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
    </button>

  /* ---- Your Schedule (its own tab, Jonna 31 Oct 2026) ---------------------
     The weekly windows companies can book on their booking page, the days off, and every
     demonstration already booked. What the firm saves wins over what MISMO recorded and reaches the
     booking pages within half an hour. A window takes one session; a long one is cut into
     back-to-back sessions (90 minutes for a first certification, 60 for a renewal). */
  function to24(t) {
    var m = String(t || "").trim().toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/);
    if (!m) return "";
    var h = +m[1], mi = +(m[2] || 0);
    if (m[3] === "pm" && h < 12) h += 12;
    if (m[3] === "am" && h === 12) h = 0;
    return (h < 10 ? "0" : "") + h + ":" + (mi < 10 ? "0" : "") + mi;
  }
  function to12(t) {
    var m = String(t || "").match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return String(t || "");
    var h = +m[1], ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12;
    return h + (m[2] === "00" ? "" : ":" + m[2]) + ap;
  }

    var entry = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), row: e.row, org: e.org, program: e.program,
      from: e.state, to: st.to, note: note, at: new Date().toISOString() };
    if (st.needs === "date") {
      entry.demoOn = el("sd-" + id).value; entry.demoTime = el("sh-" + id).value || null;
      if (!entry.demoOn) return bad("Enter the date.");
      if (!entry.demoTime) return bad("Enter the time.");
    }
    if (st.needs === "result") {
      var r = document.querySelector('input[name="sr-' + id + '"]:checked');
      if (!r) return bad("Choose No findings or Findings.");
      entry.findings = r.value === "yes";
      if (!note) return bad("Write a short summary for MISMO.");
    }
    if (st.needs === "note" && !note) return bad("Write a short note.");
    var s = R.session() || {};
    entry.by = s.name || s.email || ""; entry.email = s.email || "";
    if (btn) btn.disabled = true;
    say.className = "as-say"; say.textContent = "Saving…";
    var fresh = { kind: "assessor-steps", version: 1, firm: book.firm, entries: [] };
    Promise.resolve(R.update(current.key, "notify/assessment/moves.json", function (doc) {
      var d = doc && doc.entries ? doc : fresh;
      d.entries = (d.entries || []).concat([entry]);
      return d;
    }, stepLabel(st.to) + " - " + (e.org || ""), fresh, 3)).then(function () {
      steps = steps && steps.entries ? steps : { entries: [] };
      steps.entries = steps.entries.concat([entry]);
      openSecs.steps = true;
      drawPanel();
    })["catch"](function (err) { if (btn) btn.disabled = false; bad((err && err.message) || "That did not save."); });
  }

  /* One engagement at a time, in the panel on the right. Its parts are tabs rather than folded
     sections, so each one is its own page: Overview (where it stands and your next step), Documents,
     the Questionnaire, Earlier Certifications and Findings. */
  var ptab = "overview";

    var hn = Array.isArray(e.history) ? e.history.length : 0;
    var tabs = [["overview", "Overview", isMine(e) ? "your move" : ""], ["docs", "Documents", docCount(e) || ""],
      ["qa", "Questionnaire", qn || ""], ["hist", "Earlier Certifications", hn || ""], ["find", "Findings", countFindings(e.row) || ""]];
    if (!tabs.some(function (t) { return t[0] === ptab; })) ptab = "overview";

    var body = ptab === "docs" ? documents(e) : ptab === "qa" ? questionnaire(e) : ptab === "hist" ? history(e) : ptab === "find" ? findingsBody(e) :
      stepper(e) +

        (e.age != null ? " · " + esc(e.age) + " days at this step" : "") + "</i></div>") +

      '<div class="as-ph">' + mono(e.org) + '<div><h3>' + esc(e.org || "") + "</h3>" +
        '<div class="sub">' + esc(e.program || "") + (e.product ? " · " + esc(e.product) : "") + " · " + esc(kindLabel(e)) + "</div></div>" +
        '<div class="acts">' +
          '<button class="as-ic" type="button" id="as-wide" aria-label="' + (wide ? "Back to normal size" : "Make this wider") + '" title="' +
            (wide ? "Back to normal size" : "Make this wider") + '">' +
            (wide ? '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 20v-5h5"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5"/></svg>') +
          "</button>" +

        return '<button type="button" role="tab" class="' + (ptab === t[0] ? "on" : "") + '" data-ptab="' + t[0] + '">' + esc(t[1]) +

  function open(row) { openRow = row; ptab = "overview"; drawPanel(); }

  /* ---- View As (Jonna, 31 Oct 2026: "why can't i see it how they see it" - the same as Service

  /* ---- help --------------------------------------------------------------- */
  function paneHelp() {

      "<h3>What This Portal Is</h3>" +
      "<p>Your firm's own engagements, the material to assess them against, your schedule, and the place to record " +

      "<p>Open an engagement and it has its own tabs: <b>Overview</b> (where it stands and your next step), " +

      "newest first. Drop files on <b>This Renewal</b> (or use Choose Files) and they go straight into that renewal's " +
      "folder in MISMO's certification library, up to 70 MB each. There is no need to send anything through Teams.</p>" +

      "<h3>The Order a Certification Runs In</h3>" +
      "<table><thead><tr><th>Step</th><th>Who Moves</th><th>What Happens</th></tr></thead><tbody>" +
      "<tr><td>Application</td><td>Company</td><td>The company applies and signs the " +
      "application agreement. One application can request several products; each becomes its " +
      "own engagement.</td></tr>" +
      "<tr><td>Questionnaire</td><td>Company</td><td>The company answers the programme " +
      "questionnaire. On a renewal every prior answer is pre-filled and must be marked " +
      "confirmed or changed. You read it here, under Questionnaire in the engagement.</td></tr>" +
      "<tr><td>Assignment</td><td>MISMO</td><td>MISMO assigns the engagement to your firm and " +
      "sends the certification script - the list of audit questions and the acceptance " +
      "criterion for each. Until that arrives the engagement sits in Waiting on MISMO.</td></tr>" +
      "<tr><td>Scheduling</td><td>Company, then you</td><td>The company picks a demonstration " +

      "<tr><td>Demonstration</td><td>You</td><td>You run the scenarios in the script, record " +

      "<tr><td>Artifacts</td><td>Company</td><td>You request what the script requires; the " +

      "supplied again - it is listed for confirmation instead.</td></tr>" +
      "<tr><td>Scoring</td><td>You</td><td>You work through the script question by question " +

      "<tr><td>Preliminary results</td><td>You</td><td>You submit what you found to MISMO.</td></tr>" +
      "<tr><td>MISMO's decision</td><td>MISMO</td><td>MISMO's Product Manager approves the " +

      "<tr><td>Your invoice</td><td>You</td><td>The engagement stays visible until your fee is " +

      "</tbody></table>" +

      "<h3>Scheduling the Demonstration</h3>" +
      '<div class="as-box"><p><b>Companies book their own time.</b> When a company has paid, ' +
      "its welcome email links to a private booking page listing the open times from <b>Your " +
      "Schedule</b>. It picks one and names who is coming, and the engagement moves to " +

      "<tr><td>No findings</td><td>You tested it and it meets the standard. This is the " +
      "ordinary result; most items should end here.</td></tr>" +
      "<tr><td>Finding</td><td>You tested it and it does not meet the standard. This is what " +
      "becomes a finding the company has to remediate.</td></tr>" +
      "<tr><td>Remediation recommended</td><td>It does not meet the standard, but in your " +

      "<p>Inside an engagement, <b>Questionnaire</b> holds the company's own answers, grouped " +
      "the way the company filled them in. Each section opens on its own so you can read one " +
      "part at a time. An unanswered question shows as <i>No answer given</i> rather than being " +

      "<h3>Signing In</h3>" +

      "about an engagement that is missing or should not be there, a company or product named " +

      "</div>";
  }

  function record(row) {
    var e = byRow(row);
    if (!e) return;
    var sel = el("fo-" + row), ta = el("ft-" + row), say = el("fs-" + row);
    if (!sel || !ta) return;
    var outcome = sel.value, text = (ta.value || "").trim();
    say.className = "as-say";
    if (!outcome) { say.className = "as-say bad"; say.textContent = "Choose an outcome first."; return; }
    if (!text) { say.className = "as-say bad"; say.textContent = "Write what you found."; return; }

    var btn = document.querySelector('[data-rec="' + row + '"]');
    if (btn) btn.disabled = true;
    say.textContent = "Saving…";

    var s = R.session() || {};
    var entry = {
      at: new Date().toISOString(),
      by: s.name || s.email || "",
      outcome: outcome,
      text: text
    };
    var fresh = {
      kind: "assessor-findings", version: 1,
      row: e.row, org: e.org, program: e.program, firm: book.firm,
      entries: []
    };

    Promise.resolve(
      R.update(current.key, "findings/" + row + ".json", function (doc) {
        var d = doc && doc.entries ? doc : fresh;
        d.entries = (d.entries || []).concat([entry]);
        return d;
      }, "Finding on " + (e.org || "") + " " + (e.program || ""), fresh, 3)
    ).then(function () {
      var had = (findings[row] && findings[row].entries) || [];
      findings[row] = { entries: had.concat([entry]) };
      openSecs.find = true;
      paint();
      var s2 = el("fs-" + row);
      if (s2) { s2.className = "as-say ok"; s2.textContent = "Recorded."; }
    })["catch"](function (err) {
      if (btn) btn.disabled = false;
      var s3 = el("fs-" + row);
      if (s3) { s3.className = "as-say bad"; s3.textContent = (err && err.message) ? err.message : "That did not save."; }
    });
  }

  /* one delegated listener, so repainting never loses the wiring */
  /* The certification script workbook sits in the firm's own repository beside its engagements
     file, so it is read with the firm's own key, like everything else on this page. */
  function downloadScript(btn) {
    var row = btn.getAttribute("data-scriptdl");
    var e = list().filter(function (x) { return String(x.row) === String(row); })[0];
    var cs = e && e.certificationScript;
    if (!cs || !cs.file || !current) return;
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = "Fetching\u2026";
    R.readRaw(current.key, cs.file).then(function (r) {
      var bin = atob(r.base64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (e.org + " " + e.program + " Certification Script.xlsx").replace(/[\\/:*?"<>|]+/g, " ");
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }).catch(function () {
      alert("The certification script could not be fetched just now. Try again in a minute, or email certifications@mismo.org.");
    }).then(function () { btn.disabled = false; btn.textContent = label; });
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var c;
    if ((c = t.closest("[data-open]"))) { open(c.getAttribute("data-open")); return; }
    if ((c = t.closest("[data-go]"))) {
      ev.preventDefault();
      var g = c.getAttribute("data-go").split(":");
      if (g[1]) engFilter = g[1];
      goPane(g[0]);
      return;
    }
    if ((c = t.closest("[data-ef]"))) { engFilter = c.getAttribute("data-ef"); paint(); return; }
    if ((c = t.closest("[data-ptab]"))) { ptab = c.getAttribute("data-ptab"); drawPanel(); var pb = document.querySelector(".as-pb"); if (pb) pb.scrollTop = 0; return; }
    if ((c = t.closest("[data-uppick]"))) { var fi = document.querySelector('[data-upfile="' + c.getAttribute("data-uppick") + '"]'); if (fi) fi.click(); return; }
    if ((c = t.closest("[data-scriptdl]"))) { downloadScript(c); return; }
    if ((c = t.closest("[data-sectog]"))) {
      var id = c.getAttribute("data-sectog");
      openSecs[id] = !openSecs[id];
      drawPanel();
      return;
    }
    if ((c = t.closest("[data-qtog]"))) {
      var q = c.getAttribute("data-qtog");
      openQ[q] = !openQ[q];
      drawPanel();
      return;
    }
    if (t.closest("#as-wide")) { wide = !wide; drawPanel(); return; }
    if (t.closest("#as-shut") || t.closest("#as-scrim")) { shut(); return; }
    if ((t.closest("[data-rec]") || t.closest("[data-step]") || t.closest("[data-pnote]") || t.closest("[data-avadd]") || t.closest("[data-avdel]") || t.closest("[data-avsave]")) && !canEditFirm()) return;
    if ((c = t.closest("[data-rec]"))) { record(c.getAttribute("data-rec")); return; }
    if ((c = t.closest("[data-step]"))) { recordStep(c.getAttribute("data-step")); return; }
    if ((c = t.closest("[data-pnote]"))) { recordNote(c.getAttribute("data-pnote")); return; }
    if ((c = t.closest("[data-avadd]"))) { readAvailForm(); availDraft.windows.push({ day: "Monday", from: "10:00", to: "11:30" }); paint(); return; }
    if ((c = t.closest("[data-avdel]"))) { readAvailForm(); availDraft.windows.splice(+c.getAttribute("data-avdel"), 1); paint(); return; }
    if ((c = t.closest("[data-avsave]"))) { saveAvail(); return; }
  });

  document.addEventListener("input", function (ev) {
    if (ev.target && ev.target.id === "eng-q") { engQ = ev.target.value; engFind(); }
  });
  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t && t.hasAttribute && t.hasAttribute("data-upfile")) { uploadFiles(t.getAttribute("data-upfile"), t.files); t.value = ""; }
  });
  ["dragenter", "dragover"].forEach(function (n) {
    document.addEventListener(n, function (ev) { var d = ev.target && ev.target.closest && ev.target.closest("[data-updrop]"); if (!d) return; ev.preventDefault(); d.classList.add("over"); });
  });
  document.addEventListener("dragleave", function (ev) { var d = ev.target && ev.target.closest && ev.target.closest("[data-updrop]"); if (d && !d.contains(ev.relatedTarget)) d.classList.remove("over"); });
  document.addEventListener("drop", function (ev) {
    var d = ev.target && ev.target.closest && ev.target.closest("[data-updrop]"); if (!d) return;
    ev.preventDefault(); d.classList.remove("over");
    uploadFiles(d.getAttribute("data-updrop"), ev.dataTransfer && ev.dataTransfer.files);
  });
  /* a file dropped anywhere else is not opened by the browser in place of the portal */
  window.addEventListener("dragover", function (ev) { if (!(ev.target && ev.target.closest && ev.target.closest("[data-updrop]"))) ev.preventDefault(); });
  window.addEventListener("drop", function (ev) { if (!(ev.target && ev.target.closest && ev.target.closest("[data-updrop]"))) ev.preventDefault(); });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && openRow != null) {
      var t = e.target;
      if (t && (t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
      shut();
    }
  });

  /* ---- starting up -------------------------------------------------------- */
  function start() {
    mine = whoCanISee();
    var sess = R.session() || {};
    if (VIEWAS) {
      /* only an administrator can view as a firm; anyone else simply gets their own screen */
      var f0 = sess.platformAdmin ? FIRMS.filter(function (f) { return f.slug === VIEWAS.slug || f.key === VIEWAS.slug; })[0] : null;
      if (f0) mine = [f0]; else VIEWAS = null;
    }
    var nva = el("nav-viewas"); if (nva) nva.hidden = !(sess.platformAdmin && !VIEWAS);
    if (!mine.length) {
      el("rail").hidden = true;
      document.body.classList.add("as-noshell");
      el("as-out").hidden = false;
      el("as-main").innerHTML = '<div class="as-wrap"><div class="as-empty">' +
        "This account is signed in, but it does not hold an assessor key, so there is nothing " +
        "for it to show here.<br><br>If you assess certifications for MISMO and expected to see " +
        'your engagements, email <a href="mailto:certifications@mismo.org">MISMO Certifications</a>.' +
        "</div></div>";
      return;
    }

    el("rail").hidden = false;
    document.body.classList.remove("as-noshell");
    el("as-out").hidden = false;

    var pw = el("as-pickwrap");
    if (mine.length > 1) {
      pw.hidden = false;
      el("as-pick").innerHTML = mine.map(function (f) {
        return '<option value="' + esc(f.key) + '">' + esc(f.slug) + "</option>";
      }).join("");
      /* Label each firm with its own proper name, taken from its own file. */
      mine.forEach(function (f) {
        R.readOr(f.key, "engagements/" + f.slug + ".json", null).then(function (r) {
          var d = r && r.data ? r.data : r;
          var pick = el("as-pick");
          var opt = pick && pick.querySelector('option[value="' + f.key + '"]');
          if (opt && d && d.firm) opt.textContent = d.firm;
        })["catch"](function () {});
      });
      el("as-pick").addEventListener("change", function () {
        var k = this.value;
        var f = mine.filter(function (x) { return x.key === k; })[0];
        if (f) loadFirm(f);
      });
    } else {
      pw.hidden = true;
    }

    document.querySelectorAll(".hq nav button[data-hq]").forEach(function (b) {
      b.addEventListener("click", function () { goPane(b.getAttribute("data-hq")); });
    });

    el("as-out").addEventListener("click", function () {
      try { R.signOut(); } catch (e) {}
      location.reload();
    });

    /* ?firm=falcon opens that firm's portal (the CMS's view of a firm, 31 Oct 2026) */
    var want = null;
    try { want = new URLSearchParams(location.search).get("firm"); } catch (e) {}
    var first = mine.filter(function (f) { return want && (f.slug === want || f.key === want); })[0] || mine[0];
    if (el("as-pick") && mine.length > 1) el("as-pick").value = first.key;
    loadFirm(first);
  }

  /* what the rail's search reads, and how it opens what it finds */
  window.__assessorBook = function () { return book; };
  window.__assessorOpen = function (row) { open(row); };

  /* December, every year, with no upkeep */
  if (new Date().getMonth() === 11) {
    document.documentElement.setAttribute("data-season", "december");
  }

  /* One sign-in for resources.mismo.org: someone already signed in on another MISMO tool (MISMO staff
     in the CMS) is signed in here too, as themselves. */
  try {
    if (!sessionStorage.getItem("resources:service-orders:session")) {
      var site = JSON.parse(localStorage.getItem("resources:session") || "null");
      if (site && site.token && (!site.expiresAt || new Date(site.expiresAt).getTime() > Date.now()))
        sessionStorage.setItem("resources:service-orders:session", JSON.stringify(site));
    }
  } catch (e1) {}
  Promise.resolve(R.boot()).then(function () {
    if (R.signedIn()) start(); else gate("");
  })["catch"](function () { gate(""); });
})();
</script>

<script>
/* The rail: collapse, remember, search. Copied from the MISMO rail pattern;
   only gather() is this page's own. */
(function(){
  "use strict";
  const KEY='hq.rail.off';

  function set(off, remember){
    document.body.classList.toggle('railmini', !!off);
    const h=document.getElementById('rail-hide');
    if(h){ h.setAttribute('aria-expanded', off?'false':'true');
      h.setAttribute('aria-label', off?'Open the menu':'Narrow the menu');
      h.title = (off?'Open the menu':'Narrow the menu')+' (backslash)'; }
    if(off) close();
    if(remember!==false){ try{ localStorage.setItem(KEY, off?'1':'0'); }catch(e){} }
    setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 230);
  }
  function toggle(){ set(!document.body.classList.contains('railmini')); }

  function start(){
    let off=null;
    try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==='1'); }catch(e){}
    if(off===null) off = window.matchMedia('(max-width:900px)').matches;
    set(off, false);
    const h=document.getElementById('rail-hide'); if(h) h.addEventListener('click',toggle);
    const sc=document.getElementById('rail-scrim'); if(sc) sc.addEventListener('click',()=>set(true));
    const qb=document.getElementById('rail-qb');
    if(qb) qb.addEventListener('click',()=>{ set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q) q.focus(); },230); });
    document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
      b.addEventListener('click',()=>{
        if(window.matchMedia('(max-width:900px)').matches) set(true);
      });
    });
    wireFind();
  }

  document.addEventListener('keydown',e=>{
    const t=e.target;
    const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    if(e.key==='\\' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
      e.preventDefault(); set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q');
        if(q){ q.focus(); q.select(); } }, 230);
    }
  });

  const HITS=()=>document.getElementById('rail-hits');
  let picked=-1, rows=[];
  function norm(x){ return String(x||'').replace(/\s+/g,' ').trim().toLowerCase(); }

  function gather(q){
    const t=norm(q); if(t.length<2) return [];
    const out=[];
    const score=(name)=>{ const n=norm(name);
      return n===t ? 3 : n.indexOf(t)===0 ? 2 : n.indexOf(t)>=0 ? 1 : 0; };
    const push=(group,name,where,go)=>{
      if(out.length<60) out.push({group,name,where,go,s:score(name)});
    };

    try{
      const B = window.__assessorBook ? window.__assessorBook() : null;
      ((B && B.engagements) || []).forEach(e=>{
        const hay = norm(e.org) + ' ' + norm(e.program) + ' ' + norm(e.product);
        if(hay.indexOf(t) < 0) return;
        push('Engagements', e.org,
          (e.program||'') + (e.product ? ' · ' + e.product : ''),
          ()=>{ go('open'); try{ window.__assessorOpen(e.row); }catch(err){} });
      });
    }catch(e){}

    const best={};
    out.forEach(h=>{ best[h.group]=Math.max(best[h.group]||0, h.s); });
    const ORDER=['Engagements'];
    out.sort((a,b)=>
      (best[b.group]-best[a.group])
      || (ORDER.indexOf(a.group)-ORDER.indexOf(b.group))
      || (b.s-a.s)
      || String(a.name).localeCompare(String(b.name)));
    return out;
  }
  function go(tab){
    const b=document.querySelector('.hq nav button[data-hq="'+tab+'"]');
    if(b && !b.hasAttribute('aria-current')) b.click();
  }

  function draw(list){
    const box=HITS(); if(!box) return;
    box.textContent=''; rows=[]; picked=-1;
    if(!list.length){
      const n=document.createElement('div'); n.className='rh-none';
      n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return;
    }
    let g=null;
    list.slice(0,24).forEach(h=>{
      if(h.group!==g){ g=h.group;
        const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh';
      const nm=document.createElement('b'); nm.textContent=h.name; b.appendChild(nm);
      if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); });
      rows.push(b); box.appendChild(b);
    });
    box.hidden=false;
  }
  function close(){ const b=HITS(); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on', i===picked));
    if(rows[picked]) try{ rows[picked].scrollIntoView({block:'nearest'}); }catch(e){} }

  function wireFind(){
    const q=document.getElementById('rail-q'), x=document.getElementById('rail-qx');
    if(!q) return;
    let tmr=null;
    const run=()=>{ const v=q.value;
      if(x) x.hidden = !v;
      if(norm(v).length<2){ close(); return; }
      draw(gather(v)); };
    q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); });
    q.addEventListener('focus',()=>{ if(norm(q.value).length>=2) run(); });
    q.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ close(); q.blur(); return; }
      if(!rows.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); }
      else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); }
    });
    if(x) x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
    document.addEventListener('click',e=>{
      if(!e.target.closest('.railfind')) close();
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
  window.__rail={ show:()=>set(false), hide:()=>set(true), toggle,
    mini:()=>document.body.classList.contains('railmini') };
})();
</script>

<script>
/* The theme toggle, sharing mismo.portal.theme with every other MISMO page. */
(function theme(){
  var btn = document.getElementById("theme-btn");
  if(!btn) return;
  function cur(){
    var t = document.documentElement.getAttribute("data-theme");
    if(t) return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function paint(){
    const dark = cur() === "dark";
    const lab = document.getElementById("theme-lab");
    if(lab) lab.textContent = dark ? "Light Mode" : "Dark Mode";
    else btn.textContent = dark ? "Light Mode" : "Dark Mode";
    btn.title = "Switch to " + (dark ? "light" : "dark") + " mode";
  }
  btn.addEventListener("click", function(){
    document.documentElement.setAttribute("data-theme", cur() === "dark" ? "light" : "dark");
    paint();
    try{ localStorage.setItem("mismo.portal.theme", cur()); }catch(e){}
    window.dispatchEvent(new Event("resize"));
  });
  try{
    var saved = localStorage.getItem("mismo.portal.theme");
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  }catch(e){}
  paint();
})();
</script>
