<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MISMO Assessor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="portal.css">
<style>
/* ── The assessor portal's own layer ────────────────────────────────────────
   Everything above comes from portal.css, the Service Orders stylesheet copied
   across unchanged. Only what is new to this page is declared here, prefixed
   as- so it can never collide with the chassis.

   The shape follows the Certification Management System: a scannable list of
   cards, and one record at a time in a panel on the right with labelled
   sections. Nothing expands inline, because an engagement carries a twenty-odd
   question questionnaire and inline expansion turns the list into a mile of
   scroll where you cannot tell what is what. */

/* Tags are rectangles here, not pills. */
.chip, .as-tag{border-radius:3px}
.as-tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);
  font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;
  padding:2px 7px;border-radius:3px;background:var(--surface-3);color:var(--ink-2);
  white-space:nowrap}
.as-tag.you{background:rgba(162,112,26,.16);color:var(--warn)}
.as-tag.good{background:rgba(15,123,92,.13);color:var(--good)}
.as-tag.bad{background:rgba(179,55,44,.12);color:var(--bad)}
.as-tag.cool{background:var(--surface-3);color:var(--ink-2)}

.as-wrap{padding:26px 30px 90px}
.as-doccyc{margin:14px 0 4px;font-size:13px;color:var(--ink)}
.as-doccyc span{color:var(--ink-3);font-size:12px;margin-left:6px}
.as-docs{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
.as-docs li{padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;overflow-wrap:anywhere}
.as-docs li small{color:var(--ink-3);margin-left:6px;white-space:nowrap}
.as-pane{display:none}
.as-pane.on{display:block}
.as-h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.014em;
  color:var(--ink);margin:0 0 4px}
.as-asof{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--ink-3);
  margin:0 0 22px;font-variant-numeric:tabular-nums}
.as-lede{font-family:var(--display);font-size:13.5px;color:var(--ink-2);line-height:1.6;
  margin:0 0 20px}

/* ── The board, copied from the Certification Management System ────────────
   The CMS already shows MISMO what a firm's portal looks like, and that preview
   is the agreed design. These rules are the same rules, so the two pages do not
   drift: the navy headline card with four tiles, then one panel per section with
   a real table inside it. The only deliberate difference is that tags here are
   rectangles rather than pills. */

.asb-head{background:var(--navy,#0d314c);color:#fff;border-radius:8px;padding:20px 22px;
  display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.asb-head .hl-date{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--sky-soft,#a8d8f2)}
.hl-body{display:flex;flex-direction:column;gap:14px}
.asb-say{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.35;color:#fff}
.asb-say em{font-style:normal}
.asb-say em.hl-late{color:#ffcf73}
.hl-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.as-sub{margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--border)}
.as-sub h3{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--ink)}
.as-sub .psub{margin:0}
@media (max-width:1100px){.hl-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.hl-tiles{grid-template-columns:1fr}}
.hl-tile{background:rgba(255,255,255,.07);border:1px solid rgba(116,191,235,.28);
  border-radius:6px;padding:12px 14px;display:block;width:100%;text-align:left}
.hl-tile b{display:block;font-size:28px;font-weight:700;line-height:1.1;color:#fff;
  font-variant-numeric:tabular-nums}
.hl-tile span{display:block;font-size:12px;color:var(--sky-soft,#a8d8f2);margin-top:3px}
.hl-tile small{display:block;font-size:11.5px;color:rgba(255,255,255,.6);margin-top:2px}
.hl-tile.warn b{color:#ffcf73}

.asb-panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:20px 22px;margin-bottom:28px}
.asb-panel h2{font-family:var(--display);font-size:21.75px;font-weight:600;letter-spacing:-.012em;
  line-height:1.55;color:var(--ink);margin:0}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.phead>div:first-child{flex:1 1 420px;min-width:0}
.asb-panel .psub{font-size:12.5px;line-height:1.55;color:var(--ink-3);margin:4px 0 16px}

.etable{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.ehead,.erow{display:grid;grid-template-columns:2fr 1fr 1.3fr .8fr .7fr auto;gap:14px;
  align-items:center;padding:10px 15px;text-align:left}
.ehead{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:700;color:var(--ink-3);background:var(--surface-3);
  border-bottom:1px solid var(--border-strong)}
.erow{width:100%;background:var(--surface);border:0;border-bottom:1px solid var(--rule,var(--border));
  font:inherit;font-family:var(--display);font-size:13px;color:var(--ink);cursor:pointer}
.erow:last-child{border-bottom:0}
.erow:hover{background:var(--surface-2)}
.erow:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.erow.mine{box-shadow:inset 3px 0 0 var(--c3,#0f7b5c)}
.erow.flat{cursor:default}
.erow.flat:hover{background:var(--surface)}
.erow .num,.ehead .num{text-align:right;font-variant-numeric:tabular-nums}
.ehead.coming,.erow.coming{grid-template-columns:2fr 1fr 1.4fr}
.e-co{font-weight:600;min-width:0}
.e-pr{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3);margin-top:1px}
.e-sub{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.e-sub.bad{color:var(--bad);font-weight:600}
.e-pg,.e-st,.e-sc,.e-fee{min-width:0}
.e-go{font-size:11.5px;font-weight:600;color:var(--navy-mid,#14486e);white-space:nowrap;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:860px){
  .ehead{display:none}
  .erow{grid-template-columns:1fr auto;row-gap:4px;padding:12px 14px}
  .erow .e-pg,.erow .e-st{grid-column:1}
  .erow .e-sc,.erow .e-fee{grid-column:2;text-align:right}
  .erow .e-co{grid-column:1 / -1}
  .erow .e-go{grid-column:1 / -1;padding-top:2px}
  .erow.coming{grid-template-columns:1fr auto;row-gap:3px}
  .erow.coming .e-co{grid-column:1 / -1}
  .erow.coming .e-st{text-align:right}
}

table.av{width:100%;border-collapse:collapse;margin:0 0 12px;font-family:var(--display);
  font-size:13px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
table.av th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:7px 12px;
  background:var(--surface-3);border-bottom:1px solid var(--border-strong)}
table.av td{padding:9px 12px;border-bottom:1px solid var(--rule,var(--border));color:var(--ink)}
table.av tr:last-child td{border-bottom:0}
table.av td:first-child{font-weight:600;white-space:nowrap}

.prog-facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.fact{font-size:11.5px;color:var(--ink-2);background:var(--chip,var(--surface-3));
  border-radius:3px;padding:3px 10px}
.fact.no{color:var(--ink-3);border:1px dashed var(--border-strong);background:transparent;
  text-decoration:line-through;text-decoration-color:var(--bad)}

.asb-empty{border:1px dashed var(--border-strong);border-radius:8px;padding:26px 20px;
  text-align:center;color:var(--ink-3);font-family:var(--display);font-size:13px;
  background:var(--surface-2)}
.as-empty{border:1px dashed var(--border-strong);border-radius:9px;padding:34px 24px;
  text-align:center;color:var(--ink-3);font-family:var(--display);font-size:13.5px;
  background:var(--surface-2)}
.as-bad{border:1px solid var(--bad);border-radius:8px;background:rgba(179,55,44,.08);
  color:var(--bad);font-family:var(--display);font-size:13px;padding:12px 14px;margin-bottom:18px}

/* The panel on the right, one engagement at a time */
.as-panel{position:fixed;top:0;right:0;bottom:0;width:min(680px,calc(100vw - 56px));z-index:121;
  background:var(--ground);border-left:1px solid var(--border-strong);
  box-shadow:-10px 0 34px rgba(6,32,47,.28);display:none;flex-direction:column}
.as-panel.on{display:flex}
.as-panel.wide{width:min(1100px,calc(100vw - 56px))}
.as-scrim{position:fixed;inset:0;z-index:120;background:rgba(6,32,47,.42);border:0;padding:0;display:none}
.as-scrim.on{display:block}
.as-ph{display:flex;align-items:flex-start;gap:12px;padding:15px 20px;background:var(--surface);
  border-bottom:1px solid var(--border);flex:0 0 auto}
.as-ph h3{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.012em;
  color:var(--ink);margin:0;line-height:1.25;overflow-wrap:anywhere}
.as-ph .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px;
  overflow-wrap:anywhere}
.as-ph .acts{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.as-ic{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--border-strong);border-radius:5px;
  color:var(--ink-2);cursor:pointer;padding:0}
.as-ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.as-ic:hover{background:var(--surface-3);color:var(--ink)}
.as-ic:focus-visible{outline:2px solid var(--sky);outline-offset:1px}
.as-pb{overflow:auto;padding:0 20px 70px;flex:1 1 auto}

/* A section inside the panel: shut by default, opens on a click on its heading */
.as-sec{border-bottom:1px solid var(--rule,var(--border))}
.as-sh{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;
  border:0;padding:15px 0;font:inherit;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--ink-2);
  cursor:pointer}
.as-sh:hover{color:var(--ink)}
.as-sh:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.as-sh .cv{width:13px;height:13px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;color:var(--ink-3);transition:transform .15s ease}
.as-sec.open .as-sh .cv{transform:rotate(90deg)}
.as-sh .cnt{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
  letter-spacing:.06em;font-variant-numeric:tabular-nums}
.as-sb{display:none;padding:0 0 20px}
.as-sec.open .as-sb{display:block}
.as-sec.always .as-sb{display:block}

.as-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:15px 22px}
.as-k{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;color:var(--ink-3);margin-bottom:2px}
.as-v{font-family:var(--display);font-size:14px;font-weight:500;color:var(--ink);
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.as-v.none{color:var(--ink-3);font-weight:400}
.as-note{font-family:var(--display);font-size:12.5px;color:var(--ink-3);margin:14px 0 0}

/* The questionnaire, one closed block per section of the form */
.as-qsec{border:1px solid var(--border);border-radius:7px;background:var(--surface);
  margin-bottom:8px;overflow:hidden}
.as-qh{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;
  border:0;padding:11px 13px;font:inherit;font-family:var(--display);font-size:13px;
  font-weight:600;color:var(--ink);cursor:pointer}
.as-qh:hover{background:var(--surface-2)}
.as-qh:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.as-qh .cv{width:12px;height:12px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;color:var(--ink-3);transition:transform .15s ease}
.as-qsec.open .as-qh .cv{transform:rotate(90deg)}
.as-qh .cnt{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.as-qb{display:none;padding:2px 13px 10px;border-top:1px solid var(--rule,var(--border))}
.as-qsec.open .as-qb{display:block}
.as-qa{margin:0;padding:0;list-style:none}
.as-qa li{padding:10px 0;border-bottom:1px solid var(--rule,var(--border))}
.as-qa li:last-child{border-bottom:0}
.as-qa .q{font-family:var(--display);font-size:12px;font-weight:600;color:var(--ink-2);
  margin-bottom:3px}
.as-qa .a{font-family:var(--display);font-size:13px;color:var(--ink);line-height:1.55;
  overflow-wrap:anywhere;white-space:pre-wrap}
.as-qa .a.none{color:var(--ink-3);font-style:italic}

.as-hist div{padding:9px 0;border-bottom:1px solid var(--rule,var(--border));
  font-family:var(--display);font-size:13px;color:var(--ink)}
.as-hist div:last-child{border-bottom:0}
.as-hist b{font-weight:600}
.as-hist span{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:8px;
  font-variant-numeric:tabular-nums}

/* Recording a finding */
.as-find label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;font-weight:700;color:var(--ink-3);margin:0 0 4px}
.as-f{margin-bottom:13px}
.as-find select, .as-find textarea{width:100%;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:5px;color:var(--ink);font:inherit;
  font-family:var(--display);font-size:13px;padding:9px 10px}
.as-find textarea{min-height:98px;resize:vertical;line-height:1.55}
.as-find select:focus, .as-find textarea:focus{outline:2px solid var(--sky);outline-offset:-1px}
.as-go{background:var(--navy,#0d314c);color:#fff;border:0;border-radius:5px;padding:10px 18px;
  font:inherit;font-family:var(--display);font-size:13px;font-weight:600;cursor:pointer;
  white-space:nowrap;min-width:max-content}
.as-go:hover:not(:disabled){background:var(--navy-mid,#14486e)}
.as-go:disabled{opacity:.45;cursor:not-allowed}
.as-go.ghost{background:transparent;color:var(--ink);border:1px solid var(--border-strong)}
.as-go.ghost:hover:not(:disabled){background:var(--surface-3)}
table.av select, table.av input{font:inherit;font-size:13px;padding:5px 7px;border:1px solid var(--border-strong);border-radius:5px;background:var(--surface);color:var(--ink)}
.as-go:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.as-say{font-family:var(--display);font-size:12.5px;margin-left:12px}
.as-say.ok{color:var(--good)}
.as-say.bad{color:var(--bad)}
.as-one{border:1px solid var(--border);border-radius:6px;background:var(--surface);
  padding:11px 13px;margin-bottom:8px}
.as-one p{margin:7px 0 0;font-family:var(--display);font-size:13px;color:var(--ink);
  line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.as-when{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* Help */
.as-help h3{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.008em;
  color:var(--ink);margin:30px 0 7px}
.as-help h3:first-child{margin-top:0}
.as-help p{font-family:var(--display);font-size:13.5px;color:var(--ink-2);line-height:1.65;
  margin:0 0 11px}
.as-help ul{margin:0 0 13px;padding-left:19px}
.as-help li{font-family:var(--display);font-size:13.5px;color:var(--ink-2);line-height:1.65;
  margin-bottom:6px}
.as-help b{color:var(--ink);font-weight:600}
.as-help .as-box{border:1px solid var(--border);border-left:3px solid var(--sky,#74bfeb);
  border-radius:7px;background:var(--surface);padding:13px 15px;margin:0 0 15px}
.as-help .as-box p:last-child{margin-bottom:0}
.as-help table{width:100%;border-collapse:collapse;margin:0 0 15px;
  font-family:var(--display);font-size:13px}
.as-help th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:7px 10px;
  background:var(--surface-3);border-bottom:1px solid var(--border-strong)}
.as-help td{padding:9px 10px;border-bottom:1px solid var(--rule,var(--border));
  color:var(--ink-2);vertical-align:top}
.as-help td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}

.as-sign-out{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;
  border-radius:5px;padding:5px 10px;font:inherit;font-family:var(--display);font-size:11.5px;
  cursor:pointer;white-space:nowrap;min-width:max-content}
.as-sign-out:hover{background:rgba(255,255,255,.18)}

/* .hq.rail sets display:flex, which beats the browser's own rule for [hidden],
   so the rail has to be told explicitly to go away when it is hidden. */
.hq.rail[hidden]{display:none}
body.as-noshell{padding-left:0}
body.as-noshell .hqtop{margin-left:0;width:100%}
body.as-noshell .railscrim{display:none}
</style>
</head>

<script>window.RELAY={"base": "https://rgvdi67cg27o5kcmiytcqbqnrm0hmztx.lambda-url.us-east-1.on.aws", "projects": ["as-falcon", "as-actualize", "as-vianteye"], "slugs": {"as-falcon": "falcon", "as-actualize": "actualize", "as-vianteye": "vianteye"}, "lite": [], "note": "base is the relay's Lambda function URL. projects is every key this page may sign in against, tried in turn: the three assessor firms. (Until 25 Oct 2026 this held the Service Orders keys, copied with relay.js, so an account with only an assessor key could not sign in.)"};</script>
<script src="relay.js"></script>
<script>
/* ── The assessor portal ──────────────────────────────────────────────────────
 *
 * A firm signs in and sees its own engagements: the companies it is assessing,
 * the questionnaire answers to assess them against, what MISMO pays it, and the
 * same company's earlier certifications so a renewal can be judged against what
 * was found last time.
 *
 * It sees nothing else. Not another firm's work, not what the company was
 * charged, not MISMO's revenue - because none of that is in the file it is
 * given. The cutting happens on the server, in cms-data's build-engagements.js,
 * before anything is published. This page could not show those figures if it
 * tried.
 *
 * Reads   engagements/<firm>.json   from the firm's own repository
 * Writes  findings/<row>.json       to the same place
 *
 * Both paths are enforced by the relay against the firm's key, so a page bug
 * cannot reach past them either.
 */
(function () {
  "use strict";

  var R = window.MISMO_RELAY;

  /* The three firms with a portal. A person sees a firm only if their account
     holds that firm's key - the list here just says which keys mean "assessor".
     The firm's proper name comes out of its own file, never typed in here. */
  var FIRMS = [
    { key: "as-falcon",    slug: "falcon" },
    { key: "as-actualize", slug: "actualize" },
    { key: "as-vianteye",  slug: "vianteye" }
  ];

  var OUTCOMES = [
    { v: "",                      t: "Choose an outcome" },
    { v: "pass",                  t: "No findings — meets the standard" },
    { v: "fail",                  t: "Finding — does not meet the standard" },
    { v: "recommend_remediation", t: "Finding — remediation recommended" },
    { v: "waiting_on_artifact",   t: "Waiting on an artifact" },
    { v: "note",                  t: "Observation, no outcome" }
  ];

  /* The steps an assessor records here. Each one moves the certification on MISMO's board
     within half an hour, and tells whoever is next - nobody at MISMO has to do it. Approving
     and everything else that is MISMO's decision is not on this list. */
  var STEPS = {
    DemoProposed: [{ to: "DemoScheduled", t: "Confirm the Date",
      n: "Enter the time you are confirming. The company is told straight away; then send the calendar invitation.", needs: "date" }],
    DemoScheduled: [
      { to: "AwaitingArtifacts", t: "The Demonstration Is Done",
        n: "Say which artifacts you have asked the company for. The engagement waits on the company until they arrive.", needs: "note" },
      { to: "AwaitingDemoSelection", t: "It Needs a New Date",
        n: "The company's booking page reopens and they are asked to pick another time. Say why.", needs: "note" }],
    AwaitingArtifacts: [{ to: "ArtifactReview", t: "The Artifacts Have Arrived", n: "Starts your review.", needs: "optional" }],
    ArtifactReview: [{ to: "PrelimResultsSubmitted", t: "Submit the Preliminary Result",
      n: "Goes to MISMO's VP for review. Findings are never shown to the company before MISMO approves.", needs: "result" }],
    PrelimQueryOpen: [{ to: "PrelimResultsSubmitted", t: "Answer MISMO's Question and Resubmit", n: "Goes back to MISMO's VP.", needs: "result" }],
    RemediationOpen: [{ to: "RemediationSubmitted", t: "Remediation Evidence Reviewed",
      n: "Say how each finding was closed on its evidence. Goes to MISMO's VP.", needs: "note" }],
    RemediationEscalated: [{ to: "RemediationOpen", t: "Send It Back to the Company", n: "", needs: "note" }],
    RemediationQueryOpen: [{ to: "RemediationSubmitted", t: "Answer MISMO's Question", n: "Goes back to MISMO's VP.", needs: "note" }],
    ScopeReviewAssessor: [{ to: "ScopeReviewVp", t: "Pass the Scope to MISMO's VP", n: "", needs: "note" }]
  };
  var DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];

  var mine = [];        /* the firms this account can see */
  var current = null;   /* the one being shown */
  var book = null;      /* its engagements file */
  var findings = {};    /* row -> the findings file for that engagement */
  var steps = null;     /* notify/assessment/moves.json: the steps this firm has recorded */
  var answers = null;   /* engagements/<firm>-inbox.json: what MISMO's board did with each */
  var avail = null;     /* notify/assessment/availability.json: the firm's own open times */
  var availDraft = null;/* the availability being edited, before it is saved */
  var openRow = null;   /* the engagement in the panel, if any */
  var openSecs = { find: true };  /* which panel sections are open */
  var openQ = {};       /* which questionnaire sections are open */
  var wide = false;
  var pane = "open";

  /* ---- small helpers ------------------------------------------------------ */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function el(id) { return document.getElementById(id); }
  function money(n) {
    if (n == null || n === "" || isNaN(Number(n))) return null;
    return "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
  }
  function day(iso) {
    if (!iso) return null;
    /* A bare date is a calendar day, not midnight UTC - read as UTC it shows the day before
       anywhere west of Greenwich. */
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    var d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(iso);
    if (isNaN(d)) return String(iso).slice(0, 10);
    return d.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  }
  function outcomeText(v) {
    for (var i = 0; i < OUTCOMES.length; i++) if (OUTCOMES[i].v === v) return OUTCOMES[i].t;
    return v || "";
  }
  function outcomeTone(v) {
    if (v === "pass") return "good";
    if (v === "fail" || v === "recommend_remediation") return "bad";
    return "cool";
  }
  function list() { return (book && book.engagements) || []; }
  function byRow(row) {
    return list().filter(function (e) { return String(e.row) === String(row); })[0] || null;
  }
  function countFindings(row) {
    var d = findings[row];
    return (d && d.entries) ? d.entries.length : 0;
  }

  /* ---- the sign-in card --------------------------------------------------- */
  function gate(note) {
    el("rail").hidden = true;
    document.body.classList.add("as-noshell");
    el("as-out").hidden = true;
    shut();
    el("as-main").innerHTML =
      '<div class="signwrap"><div class="signcard">' +
        '<div class="signmark">' +
          '<svg class="wordmark" role="img" aria-label="MISMO" viewBox="0 0 708 108"><use href="#mismo-logo"/></svg>' +
        '</div>' +
        '<h2>Assessor Portal</h2>' +
        '<p class="signsub">The certifications your firm is assessing for MISMO, what each ' +
        'applicant has told us, and somewhere to record what you find.</p>' +
        '<div id="si-note" class="signnote">' +
          (note ? '<div class="note warn">' + esc(note) + "</div>" : "") +
        '</div>' +
        '<div class="signfields">' +
          '<div class="f"><label for="si-email">Email</label>' +
            '<input type="email" id="si-email" autocomplete="username" spellcheck="false" ' +
            'autocapitalize="off" placeholder="you@yourcompany.com"></div>' +
          '<div class="f"><label for="si-pass">Password</label>' +
            '<input type="password" id="si-pass" autocomplete="current-password" ' +
            'placeholder="the password you were sent"></div>' +
        '</div>' +
        '<button class="signgo" type="button" id="si-go">Sign In</button>' +
        '<div class="signerr" id="si-err"></div>' +
        '<p class="signfine">Your session lasts four hours and ends when you close this tab.<br>' +
        'No password? Email <a href="mailto:certifications@mismo.org">MISMO Certifications</a>.</p>' +
      "</div></div>";

    var go = el("si-go"), err = el("si-err");
    function fail(m) { err.textContent = m; go.disabled = false; go.textContent = "Sign In"; }
    function submit() {
      var email = (el("si-email").value || "").trim();
      var pass = el("si-pass").value || "";
      err.textContent = "";
      if (!email || !pass) { fail("Enter your email and password."); return; }
      go.disabled = true;
      go.textContent = "Signing in…";
      Promise.resolve(R.loginAny(email, pass)).then(function () {
        start();
      })["catch"](function (e) {
        fail((e && e.message) ? e.message : "That email and password did not match.");
      });
    }
    go.addEventListener("click", submit);
    ["si-email", "si-pass"].forEach(function (id) {
      el(id).addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
    });
  }

  /* ---- loading ------------------------------------------------------------ */
  function whoCanISee() {
    var s = R.session() || {};
    var access = s.access || {};
    /* A MISMO platform administrator can read every firm through the relay, so the
       page shows all three rather than only the keys written on their account. */
    if (s.platformAdmin) return FIRMS.slice();
    return FIRMS.filter(function (f) { return !!access[f.key]; });
  }

  /* May this person record steps, findings and availability for the firm on screen? Edit
     (staff) or admin access to that firm's key, or a MISMO platform administrator. Someone given
     View - MISMO's VP, say, watching all three firms - sees everything and records nothing: a
     step recorded here is real, it moves the certification and sends the next email. */
  function canEditFirm() {
    var s = R.session() || {};
    if (s.platformAdmin) return true;
    var r = (s.access || {})[current && current.key];
    return r === "admin" || r === "staff" || r === "facilitator";
  }
  var VIEW_NOTE = '<p class="psub" style="margin:8px 0 0">View only. You can see everything here; recording ' +
    "steps, findings and availability is for the firm's own assessors.</p>";

  function loadFirm(firm) {
    current = firm;
    book = null;
    findings = {};
    steps = null; answers = null; avail = null; availDraft = null;
    shut();
    paint();
    return R.read(firm.key, "engagements/" + firm.slug + ".json")
      .then(function (r) {
        book = r.data;
        paint();
        return Promise.all([loadFindings(), loadSteps()]);
      })["catch"](function (e) {
        book = { error: (e && e.message) ? e.message : String(e) };
        paint();
      });
  }

  function loadSteps() {
    var k = current.key;
    function grab(p) { return R.readOr(k, p, null).then(function (r) { return r && r.data !== undefined ? r.data : r; })["catch"](function () { return null; }); }
    return Promise.all([grab("notify/assessment/moves.json"), grab("engagements/" + current.slug + "-inbox.json"),
      grab("notify/assessment/availability.json")]).then(function (x) {
      steps = x[0]; answers = x[1]; avail = x[2];
      paint();
    });
  }

  function loadFindings() {
    if (!book || !book.engagements) return Promise.resolve();
    return Promise.all(book.engagements.map(function (e) {
      return R.readOr(current.key, "findings/" + e.row + ".json", null)
        .then(function (r) {
          var d = r && r.data ? r.data : r;
          if (d && d.entries && d.entries.length) findings[e.row] = d;
        })["catch"](function () { /* no findings yet is not an error */ });
    })).then(paint);
  }

  /* ---- the board ----------------------------------------------------------
   *
   * The same shape the Certification Management System already shows MISMO when
   * it previews a firm's portal: a sentence that says what is actually waiting,
   * four tiles, then three sections - what is with you, what MISMO still owes
   * you, and what is queued behind somebody else. Finished and the rows stop
   * appearing, unless you have not invoiced for them.
   */

  function kindLabel(e) {
    if (e.kind === "initial") return "Initial";
    if (e.kind === "renewal") return e.renewalNumber ? "Renewal " + e.renewalNumber : "Renewal";
    return "Not recorded";
  }
  function isMine(e) { return !!(e.waiting && String(e.waiting).indexOf("Assessor") >= 0); }
  /* Approved and with MISMO's licensing step. It stays on the board only while the
     firm still has to invoice for it. */
  function showToFirm(e) { return !e.done || e.assessorFee == null; }
  /* A certification that has closed - certified, not certified, canceled, or an application that
     expired - is finished: it is never Coming to You (Jonna, 31 Oct 2026). One the firm worked
     and has not invoiced for yet stays in its queue, as before. */
  var CLOSED = ["Certified", "NotCertified", "Canceled", "ApplicationExpired"];
  function closed(e) { return CLOSED.indexOf(e.state) >= 0; }
  /* Already worked by this firm: the demonstration or review has happened, or it has scored or
     recorded findings against it. When one of these is waiting on somebody else it stays in the
     firm's To Do (it is the firm's engagement, in flight); Coming to You is only for engagements
     the firm has not touched yet (Jonna, 26 Oct 2026). */
  var WORKED = ["AwaitingArtifacts", "ArtifactReview", "PrelimResultsSubmitted", "PrelimQueryOpen",
    "RemediationOpen", "RemediationEscalated", "RemediationSubmitted", "RemediationQueryOpen",
    "AppealOpen", "ScopeReviewVp", "ScopeReviewCompany", "ApprovedPendingLicense", "LicenseSent"];
  function worked(e) {
    return WORKED.indexOf(e.state) >= 0 || !!e.done || !!(e.prelim && e.prelim.scored) || countFindings(e.row) > 0;
  }

  function em(n, late) { return "<em" + (late ? ' class="hl-late"' : "") + ">" + n + "</em>"; }

  function headline(mine, withMe, others, blocked, inFlight, everything) {
    inFlight = inFlight || [];
    var invoiced = (everything || mine).filter(function (e) { return e.assessorFee != null; });
    var feeTotal = invoiced.reduce(function (t, e) { return t + (e.assessorFee || 0); }, 0);
    var name = esc((book && book.firm) || (current && current.slug) || "your firm");

    var say = withMe.length
      ? em(withMe.length, true) + " engagement" + (withMe.length === 1 ? " is" : "s are") +
        " waiting on " + name + " right now"
      : "Nothing is waiting on " + name + " right now";
    say += ", out of " + em(mine.length) + " on the board. " +
      (blocked.length
        ? em(blocked.length, true) + " cannot start until MISMO sends the certification script."
        : (inFlight.length
          ? em(inFlight.length) + " you have worked " + (inFlight.length === 1 ? "is" : "are") +
            " waiting on somebody else" + (others.length ? ", and " : ". ")
          : "") +
          (others.length
            ? em(others.length) + " more " + (others.length === 1 ? "is" : "are") + " coming to you, not started yet."
            : inFlight.length ? "Nothing new is coming yet." : "Nothing else is queued behind them."));

    function tile(n, k, s, warn) {
      return '<div class="hl-tile' + (warn ? " warn" : "") + '"><b>' + n + "</b>" +
        "<span>" + esc(k) + "</span><small>" + esc(s) + "</small></div>";
    }
    return '<div class="asb-head">' +
      '<div class="hl-date">' +
        esc((book && book.legalName) || (book && book.firm) || "") +
        ((book && book.inHouse) ? " · MISMO’s own audit team" : " · Assessor Portal") +
      "</div>" +
      '<div class="hl-body">' +
        '<div class="asb-say">' + say + "</div>" +
        '<div class="hl-tiles">' +
          tile(withMe.length, "With You", withMe.length ? "your move" : "all clear", !!withMe.length) +
          tile(inFlight.length, "In Your Queue", "waiting on somebody else") +
          tile(others.length, "Coming to You", "not started yet") +
          (blocked.length ? tile(blocked.length, "Waiting on MISMO", "script not sent", true) : "") +
          tile(money(feeTotal) || "$0", "Invoiced",
               "across " + invoiced.length + " engagement" + (invoiced.length === 1 ? "" : "s")) +
        "</div>" +
      "</div></div>";
  }

  /* One row. The Scored column is this firm's progress through MISMO's certification
     script for that program: how many of its questions have an answer recorded. */
  function engRow(e) {
    var p = e.prelim || {};
    var mine = isMine(e);
    var n = countFindings(e.row);
    return '<button class="erow' + (mine ? " mine" : "") + '" type="button" data-open="' +
        esc(e.row) + '">' +
      '<span class="e-co">' + esc(e.org || "") +
        (e.product ? '<span class="e-pr">' + esc(e.product) + "</span>" : "") + "</span>" +
      '<span class="e-pg">' + esc(e.program || "") +
        '<span class="e-sub">' + esc(kindLabel(e)) + "</span></span>" +
      '<span class="e-st">' + esc(e.stateLabel || e.state || "") +
        '<span class="e-sub">' +
          (e.demoOn ? esc(day(e.demoOn)) : mine ? "with you" : "waiting on " + esc(e.waiting || "")) +
        "</span></span>" +

     the firm saves here wins over what MISMO recorded, and reaches the booking pages within
     half an hour. A window takes one session; a long one is cut into back-to-back sessions
     (90 minutes for a first certification, 60 for a renewal). */
  function to24(t) {
    var m = String(t || "").trim().toLowerCase().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/);
    if (!m) return "";
    var h = +m[1], mi = +(m[2] || 0);
    if (m[3] === "pm" && h < 12) h += 12;
    if (m[3] === "am" && h === 12) h = 0;
    return (h < 10 ? "0" : "") + h + ":" + (mi < 10 ? "0" : "") + mi;
  }
  function savedAvail() {
    if (avail && Array.isArray(avail.windows)) return { windows: avail.windows, blocked: avail.blocked || [], from: "you" };
    var sc = (book && book.scheduling) || {};
    if (sc.mode === "fixed-windows" && sc.windows) return { windows: sc.windows, blocked: [], from: "MISMO" };
    return { windows: [], blocked: [], from: "nobody" };
  }
  function availability() {
    if (!book || book.inHouse) return "";
    var saved = savedAvail();
    if (!canEditFirm()) {
      var list = (saved.windows || []).map(function (w) { return "<tr><td>" + esc(w.day) + "</td><td>" + esc(w.from) + "</td><td>" + esc(w.to) + "</td></tr>"; }).join("");

        '<table class="av"><thead><tr><th>Day</th><th>From</th><th>To</th></tr></thead><tbody>' +
        (list || '<tr><td colspan="3" class="none">No windows: companies offer times for the firm to confirm.</td></tr>') + "</tbody></table>" +
        ((saved.blocked || []).length ? '<p class="psub">Not available: ' + esc(saved.blocked.join(", ")) + "</p>" : "") +
        VIEW_NOTE + "</div>";
    }
    var a = availDraft || saved;
    if (!availDraft) availDraft = { windows: a.windows.map(function (w) { return { day: w.day, from: to24(w.from), to: to24(w.to) }; }), blocked: (a.blocked || []).slice() };

        '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></td></tr>';
    }).join("");
    var stamp = avail && avail.updatedAt ? "Last saved " + esc(day(avail.updatedAt)) + (avail.by ? " by " + esc(avail.by) : "") + "." :
      (saved.from === "MISMO" ? "These are the times MISMO has on record for you. Change them here whenever they change." :
       "No times saved yet, so companies are asked to offer times for you to confirm. Add your windows and they can book directly.");
    return '<div class="asb-panel"><div class="phead"><div><h2>Your Availability</h2>' +
      '<p class="psub">The weekly windows companies can book on their own booking page, in Eastern Time. ' +
      "Each window takes one session, and a booked time is taken off for everyone else. MISMO holidays are left out " +
      "automatically. " + stamp + "</p></div></div>" +

      '<div class="as-find"><div class="as-f"><label for="av-blocked">Days You Are Not Available</label>' +
      '<textarea id="av-blocked" style="min-height:60px" placeholder="2026-11-24, 2026-12-22">' + esc((d.blocked || []).join(", ")) + "</textarea></div></div>" +
      (book.scheduling && book.scheduling.reviewLink ? '<p class="psub" style="margin:0 0 12px">Your published calendar: <a href="' +

  function readAvailForm() {
    if (!availDraft) return;
    Array.prototype.forEach.call(document.querySelectorAll("[data-avday]"), function (x) { availDraft.windows[+x.getAttribute("data-avday")].day = x.value; });
    Array.prototype.forEach.call(document.querySelectorAll("[data-avfrom]"), function (x) { availDraft.windows[+x.getAttribute("data-avfrom")].from = x.value; });
    Array.prototype.forEach.call(document.querySelectorAll("[data-avto]"), function (x) { availDraft.windows[+x.getAttribute("data-avto")].to = x.value; });
    var b = el("av-blocked");
    if (b) availDraft.blocked = b.value.split(/[\s,;]+/).map(function (x) { return x.trim(); }).filter(function (x) { return /^\d{4}-\d{2}-\d{2}$/.test(x); });
  }
  function saveAvail() {
    readAvailForm();
    var say = el("av-say");
    var bad = availDraft.windows.filter(function (w) { return !w.from || !w.to || w.to <= w.from; });
    if (bad.length) { say.className = "as-say bad"; say.textContent = "Each window needs a start and a later end."; return; }
    var s = R.session() || {};
    var doc = { kind: "assessor-availability", version: 1, firm: book.firm, timezone: "ET",

      blocked: availDraft.blocked, updatedAt: new Date().toISOString(), by: s.name || s.email || "" };
    say.className = "as-say"; say.textContent = "Saving…";
    Promise.resolve(R.update(current.key, "notify/assessment/availability.json", function () { return doc; },
      "Availability from " + (book.firm || ""), doc, 3)).then(function () {
      avail = doc; availDraft = null; paint();
      var s2 = el("av-say"); if (s2) { s2.className = "as-say ok"; s2.textContent = "Saved. Booking pages show these times within half an hour."; }
    })["catch"](function (err) { say.className = "as-say bad"; say.textContent = (err && err.message) || "That did not save."; });

  function facts(e) {

      bits.push('<div><div class="as-k">' + esc(k) + "</div>" +
        '<div class="as-v' + (v == null ? " none" : "") + '">' +

    add("Where It Stands", e.stateLabel || e.state);
    add("Phase", e.phase);
    add("Waiting On", e.waiting === "Assessor" ? "You" : e.waiting);

    add("Program", e.program);
    add("Product", e.product);

      ? ("Renewal" + (e.renewalNumber ? " " + e.renewalNumber : ""))

          '<span class="as-when">' + esc(day(f.at) || "") +
          (f.by ? " · " + esc(f.by) : "") + "</span>" +
          "<p>" + esc(f.text || "") + "</p></div>";
      }).join("");
    }
    if (!canEditFirm()) return (out || '<p class="psub" style="margin:0">No findings recorded yet.</p>') + VIEW_NOTE;
    out += '<div class="as-find">' +
      '<div class="as-f"><label for="fo-' + e.row + '">Outcome</label>' +
      '<select id="fo-' + e.row + '">' +
      OUTCOMES.map(function (o) {
        return '<option value="' + esc(o.v) + '">' + esc(o.t) + "</option>";
      }).join("") + "</select></div>" +
      '<div class="as-f"><label for="ft-' + e.row + '">What You Found</label>' +
      '<textarea id="ft-' + e.row + '" placeholder="What you looked at, and what it showed."></textarea></div>' +
      '<button class="as-go" type="button" data-rec="' + e.row + '">Record This Finding</button>' +
      '<span class="as-say" id="fs-' + e.row + '"></span>' +
      "</div>";
    return out;
  }

  function stepsOf(row) {
    return ((steps && steps.entries) || []).filter(function (x) { return String(x.row) === String(row); })
      .sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
  }
  function outcomeOf(id) { return answers && answers.steps ? answers.steps[id] : null; }
  function stepLabel(to, x) {
    if (x && x.kind === "note") return "Progress Note";
    for (var k in STEPS) for (var i = 0; i < STEPS[k].length; i++) if (STEPS[k][i].to === to) return STEPS[k][i].t;
    return to;
  }
  /* A progress note (27 Oct 2026): for work that is going on without a stage changing -
     remediation calls with the company, say. It changes nothing on MISMO's board except that
     MISMO can see it, and the engagement no longer reads as gone quiet. */
  function noteForm(e) {
    if (!canEditFirm()) return "";
    var id = "pn-" + e.row;
    return '<div class="as-find" style="border-top:1px solid var(--rule,var(--border));padding-top:12px;margin-top:12px">' +
      '<div style="font-family:var(--display);font-weight:700;font-size:14px;margin:0 0 4px">Add a Progress Note</div>' +
      '<p class="psub" style="margin:0 0 10px">For work going on without a step to record: a call with the company, ' +
      "remediation under review, anything MISMO should know. The stage stays where it is; MISMO sees the note, and the " +
      "engagement is not flagged as gone quiet.</p>" +
      '<div class="as-f"><label for="' + id + '-t">Note</label><textarea id="' + id + '-t" style="min-height:70px" ' +
      'placeholder="e.g. Call with the company on Thursday to review the remaining remediations; this may be the last one."></textarea></div>' +
      '<div class="as-f"><label for="' + id + '-d">Next Contact (optional)</label><input type="date" id="' + id + '-d"></div>' +
      '<button class="as-go" type="button" data-pnote="' + esc(String(e.row)) + '">Save the Note</button>' +
      '<span class="as-say" id="' + id + '-s"></span></div>';
  }
  function recordNote(row) {
    var e = byRow(row); if (!e) return;
    var id = "pn-" + e.row, say = el(id + "-s"), btn = document.querySelector('[data-pnote="' + String(e.row) + '"]');
    function bad(m) { say.className = "as-say bad"; say.textContent = m; }
    var note = el(id + "-t") ? el(id + "-t").value.trim() : "";
    var nextOn = el(id + "-d") ? el(id + "-d").value : "";
    if (!note) return bad("Write the note first.");
    var s = R.session() || {};
    var entry = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), kind: "note", row: e.row, org: e.org,
      program: e.program, from: e.state, to: null, note: note, nextOn: nextOn || null, at: new Date().toISOString(),
      by: s.name || s.email || "", email: s.email || "" };
    if (btn) btn.disabled = true;
    say.className = "as-say"; say.textContent = "Saving…";
    var fresh = { kind: "assessor-steps", version: 1, firm: book.firm, entries: [] };
    Promise.resolve(R.update(current.key, "notify/assessment/moves.json", function (doc) {
      var d = doc && doc.entries ? doc : fresh;
      d.entries = (d.entries || []).concat([entry]);
      return d;
    }, "Progress note - " + (e.org || ""), fresh, 3)).then(function () {
      steps = steps && steps.entries ? steps : { entries: [] };
      steps.entries = steps.entries.concat([entry]);
      openSecs.steps = true;
      drawPanel();
    })["catch"](function (err) { if (btn) btn.disabled = false; bad((err && err.message) || "That did not save."); });
  }
  function stepsBody(e) {
    return stepsCore(e) + noteForm(e);
  }
  function stepsCore(e) {
    var past = stepsOf(e.row).slice(0, 6);
    var waiting = past.filter(function (x) { return x.kind !== "note" && !outcomeOf(x.id); })[0];
    var out = past.map(function (x) {
      var o = outcomeOf(x.id);
      var tone = !o ? "cool" : o.status === "applied" ? "good" : "bad";
      var said = !o ? "Sent to MISMO" : o.status === "applied" ? (x.kind === "note" ? "MISMO has it" : "On the board") : "Not applied";
      return '<div class="as-one"><span class="as-tag ' + tone + '">' + said + "</span> " +
        '<span class="as-when">' + esc(stepLabel(x.to, x)) + " · " + esc(day(x.at) || "") + (x.by ? " · " + esc(x.by) : "") +
        (x.nextOn ? " · next contact " + esc(day(x.nextOn) || x.nextOn) : "") + "</span>" +
        (o && o.status === "refused" ? "<p>" + esc(o.why || "") + "</p>" : "") +
        (x.note ? "<p>" + esc(x.note) + "</p>" : "") + "</div>";
    }).join("");
    if (waiting) {
      return out + '<p class="psub" style="margin:8px 0 0">Your last step is on its way to MISMO\'s board, which takes up to half an hour. ' +
        "You can record the next one once it has arrived.</p>";
    }
    var can = STEPS[e.state] || [];
    if (can.length && !canEditFirm()) {
      return out + '<p class="psub" style="margin:8px 0 0">Next from the assessor: ' +
        esc(can.map(function (st) { return st.t; }).join(" or ")) + ".</p>" + VIEW_NOTE;
    }
    if (!can.length) {
      return out + '<p class="psub" style="margin:8px 0 0">Nothing for you to record at this stage' +
        (e.waiting && e.waiting !== "Assessor" ? " — it is with " + esc(e.waiting) + "." : ".") + "</p>";
    }
    return out + can.map(function (st, i) {
      var id = e.row + "-" + i;
      var f = '<div class="as-find" style="border-top:1px solid var(--rule,var(--border));padding-top:12px;margin-top:12px">' +
        '<div style="font-family:var(--display);font-weight:700;font-size:14px;margin:0 0 4px">' + esc(st.t) + "</div>" +
        (st.n ? '<p class="psub" style="margin:0 0 10px">' + esc(st.n) + "</p>" : "");
      if (st.needs === "date") {
        f += '<div class="as-f" style="display:flex;gap:10px;flex-wrap:wrap"><div><label for="sd-' + id + '">Date</label>' +
          '<input type="date" id="sd-' + id + '"></div><div><label for="sh-' + id + '">Time (Eastern)</label>' +
          '<input type="time" id="sh-' + id + '"></div></div>';
      }
      if (st.needs === "result") {
        f += '<div class="as-f"><label>Result</label>' +
          '<label style="text-transform:none;letter-spacing:0;font-family:var(--display);font-size:13px;display:inline-flex;gap:6px;margin-right:16px">' +
          '<input type="radio" name="sr-' + id + '" value="no"> No findings</label>' +
          '<label style="text-transform:none;letter-spacing:0;font-family:var(--display);font-size:13px;display:inline-flex;gap:6px">' +
          '<input type="radio" name="sr-' + id + '" value="yes"> Findings</label></div>';
      }
      if (st.needs !== "date") {
        f += '<div class="as-f"><label for="sn-' + id + '">' + (st.needs === "result" ? "Summary for MISMO" : st.needs === "optional" ? "Note (optional)" : "Note") + "</label>" +
          '<textarea id="sn-' + id + '" style="min-height:70px"></textarea></div>';
      }
      return f + '<button class="as-go" type="button" data-step="' + id + '">Record This Step</button>' +
        '<span class="as-say" id="ss-' + id + '"></span></div>';
    }).join("");
  }
  function recordStep(id) {
    var parts = String(id).split("-"), i = +parts.pop(), row = parts.join("-");
    var e = byRow(row); if (!e) return;
    var st = (STEPS[e.state] || [])[i]; if (!st) return;
    var say = el("ss-" + id), btn = document.querySelector('[data-step="' + id + '"]');
    function bad(m) { say.className = "as-say bad"; say.textContent = m; }
    var note = el("sn-" + id) ? el("sn-" + id).value.trim() : "";
    var entry = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), row: e.row, org: e.org, program: e.program,
      from: e.state, to: st.to, note: note, at: new Date().toISOString() };
    if (st.needs === "date") {
      entry.demoOn = el("sd-" + id).value; entry.demoTime = el("sh-" + id).value || null;
      if (!entry.demoOn) return bad("Enter the date.");
      if (!entry.demoTime) return bad("Enter the time.");
    }
    if (st.needs === "result") {
      var r = document.querySelector('input[name="sr-' + id + '"]:checked');
      if (!r) return bad("Choose No findings or Findings.");
      entry.findings = r.value === "yes";
      if (!note) return bad("Write a short summary for MISMO.");
    }
    if (st.needs === "note" && !note) return bad("Write a short note.");
    var s = R.session() || {};
    entry.by = s.name || s.email || ""; entry.email = s.email || "";
    if (btn) btn.disabled = true;
    say.className = "as-say"; say.textContent = "Saving…";
    var fresh = { kind: "assessor-steps", version: 1, firm: book.firm, entries: [] };
    Promise.resolve(R.update(current.key, "notify/assessment/moves.json", function (doc) {
      var d = doc && doc.entries ? doc : fresh;
      d.entries = (d.entries || []).concat([entry]);
      return d;
    }, stepLabel(st.to) + " - " + (e.org || ""), fresh, 3)).then(function () {
      steps = steps && steps.entries ? steps : { entries: [] };
      steps.entries = steps.entries.concat([entry]);
      openSecs.steps = true;
      drawPanel();
    })["catch"](function (err) { if (btn) btn.disabled = false; bad((err && err.message) || "That did not save."); });
  }

  function drawPanel() {
    var p = el("as-panel");
    if (openRow == null) { p.className = "as-panel"; p.innerHTML = ""; el("as-scrim").className = "as-scrim"; return; }
    var e = byRow(openRow);
    if (!e) { openRow = null; drawPanel(); return; }

    var qn = (Array.isArray(e.answers) ? e.answers.length : 0);
    p.className = "as-panel on" + (wide ? " wide" : "");
    el("as-scrim").className = "as-scrim on";
    p.innerHTML =
      '<div class="as-ph"><div><h3>' + esc(e.org || "") + "</h3>" +
        '<div class="sub">' + esc(e.program || "") +
          (e.product ? " · " + esc(e.product) : "") +
          (e.kind === "renewal" ? " · Renewal" + (e.renewalNumber ? " " + e.renewalNumber : "")
                                : " · First certification") + "</div></div>" +
        '<div class="acts">' +
          '<button class="as-ic" type="button" id="as-wide" aria-label="' +
            (wide ? "Back to normal size" : "Make this wider") + '" title="' +
            (wide ? "Back to normal size" : "Make this wider") + '">' +
            (wide
              ? '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 20v-5h5"/></svg>'
              : '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5"/></svg>') +
          "</button>" +
          '<button class="as-ic" type="button" id="as-shut" aria-label="Close" title="Close">' +
            '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
        "</div></div>" +
      '<div class="as-pb">' +
        sec("facts", "Where It Stands", null, facts(e), true) +
        sec("steps", "Update This Engagement", (STEPS[e.state] || []).length ? "your move" : null, stepsBody(e), true) +
        sec("qa", "What the Applicant Told Us", qn ? qn + " answers" : "none", questionnaire(e)) +
        sec("hist", "Earlier Certifications",
            (Array.isArray(e.history) ? e.history.length : 0) || null, history(e)) +
        sec("docs", "Certification Documents", docCount(e) || null, documents(e)) +
        sec("find", "Findings", countFindings(e.row) || null, findingsBody(e)) +
      "</div>";
  }

  function open(row) { openRow = row; drawPanel(); }
  function shut() { openRow = null; drawPanel(); }

  /* ---- help --------------------------------------------------------------- */
  function paneHelp() {
    return '<h2 class="as-h2">Help</h2>' +
      '<p class="as-lede">How a MISMO certification runs from your side of it, and how to do ' +
      "each part of it in this portal. This is the system and the process, not the assessment " +
      "method - what to look for in a demonstration is MISMO's certification script, which " +
      "arrives with the engagement.</p>" +
      '<div class="as-help">' +

      "<h3>What This Portal Is</h3>" +
      "<p>Your firm's own engagements and nothing else. The file this page loads is cut for " +
      "your firm before it leaves MISMO's server, so another firm's work, what the company was " +
      "charged, MISMO's revenue and the price list are not in it at all. You could not reach " +
      "them by guessing a URL, and the relay would refuse the request as well.</p>" +
      '<div class="as-box"><p><b>What you do see beyond your own engagements:</b> the same ' +
      "company's earlier certifications in the same program, so a renewal can be judged against " +
      "what was found last time.</p></div>" +

      "<h3>The Board</h3>" +
      "<p>Three sections, in the order they matter to you.</p>" +
      "<ul>" +
      "<li><b>To Do</b> - the next move is yours. These carry a green edge.</li>" +
      "<li><b>Waiting on MISMO</b> - MISMO has not sent the certification script yet, so the " +
      "assessment cannot start. Nothing you do will move these; chase MISMO.</li>" +
      "<li><b>Coming to You</b> - assigned to your firm but waiting on the company or on MISMO " +
      "first. Nothing to do yet. An engagement stays here after approval only while your " +
      "invoice is outstanding, and then it leaves the board.</li>" +
      "</ul>" +
      "<p>Select any row to open it. The columns are the company and its product, the program " +
      "and whether it is an initial certification or a renewal, the stage with the " +
      "demonstration date beneath it, how far through the certification script the scoring has " +
      "got, and your fee.</p>" +

      "<h3>The Order a Certification Runs In</h3>" +
      "<table><thead><tr><th>Step</th><th>Who Moves</th><th>What Happens</th></tr></thead><tbody>" +
      "<tr><td>Application</td><td>Company</td><td>The company applies and signs the " +
      "application agreement. One application can request several products; each becomes its " +
      "own engagement.</td></tr>" +
      "<tr><td>Questionnaire</td><td>Company</td><td>The company answers the programme " +
      "questionnaire. On a renewal every prior answer is pre-filled and must be marked " +
      "confirmed or changed. You read it here, under Questionnaire in the engagement.</td></tr>" +
      "<tr><td>Assignment</td><td>MISMO</td><td>MISMO assigns the engagement to your firm and " +
      "sends the certification script - the list of audit questions and the acceptance " +
      "criterion for each. Until that arrives the engagement sits in Waiting on MISMO.</td></tr>" +
      "<tr><td>Scheduling</td><td>Company, then you</td><td>The company picks a demonstration " +
      "slot. You accept it or ask to reschedule. See below.</td></tr>" +
      "<tr><td>Demonstration</td><td>You</td><td>You run the scenarios in the script, record " +
      "the session, and capture the named screenshots.</td></tr>" +
      "<tr><td>Artifacts</td><td>Company</td><td>You request what the script requires; the " +
      "company supplies it. On a renewal, documentation already supplied does not have to be " +
      "supplied again - it is listed for confirmation instead.</td></tr>" +
      "<tr><td>Scoring</td><td>You</td><td>You work through the script question by question " +
      "and record an outcome for each.</td></tr>" +
      "<tr><td>Preliminary results</td><td>You</td><td>You submit what you found to MISMO.</td></tr>" +
      "<tr><td>MISMO's decision</td><td>MISMO</td><td>MISMO's Product Manager approves the " +
      "result or opens a question back to you. Findings are never shown to the company before " +
      "that approval.</td></tr>" +
      "<tr><td>Remediation</td><td>Company, then you</td><td>If there are findings, the company " +

      "<tr><td>Approval and licence</td><td>MISMO</td><td>MISMO approves, issues the mark " +

      "<tr><td>Your invoice</td><td>You</td><td>The engagement stays visible until your fee is " +

      "</tbody></table>" +

      "<h3>Scheduling the Demonstration</h3>" +
      '<div class="as-box"><p><b>Companies book their own time.</b> When a company has paid, ' +

      "<h3>Recording Each Step</h3>" +

      "<h3>Signing In</h3>" +

  /* ---- painting ----------------------------------------------------------- */

  function record(row) {
    var e = byRow(row);
    if (!e) return;
    var sel = el("fo-" + row), ta = el("ft-" + row), say = el("fs-" + row);
    if (!sel || !ta) return;
    var outcome = sel.value, text = (ta.value || "").trim();
    say.className = "as-say";
    if (!outcome) { say.className = "as-say bad"; say.textContent = "Choose an outcome first."; return; }
    if (!text) { say.className = "as-say bad"; say.textContent = "Write what you found."; return; }

    var btn = document.querySelector('[data-rec="' + row + '"]');
    if (btn) btn.disabled = true;
    say.textContent = "Saving…";

    var s = R.session() || {};
    var entry = {
      at: new Date().toISOString(),
      by: s.name || s.email || "",
      outcome: outcome,
      text: text
    };
    var fresh = {
      kind: "assessor-findings", version: 1,
      row: e.row, org: e.org, program: e.program, firm: book.firm,
      entries: []
    };

    Promise.resolve(
      R.update(current.key, "findings/" + row + ".json", function (doc) {
        var d = doc && doc.entries ? doc : fresh;
        d.entries = (d.entries || []).concat([entry]);
        return d;
      }, "Finding on " + (e.org || "") + " " + (e.program || ""), fresh, 3)
    ).then(function () {
      var had = (findings[row] && findings[row].entries) || [];
      findings[row] = { entries: had.concat([entry]) };
      openSecs.find = true;
      paint();
      var s2 = el("fs-" + row);
      if (s2) { s2.className = "as-say ok"; s2.textContent = "Recorded."; }
    })["catch"](function (err) {
      if (btn) btn.disabled = false;
      var s3 = el("fs-" + row);
      if (s3) { s3.className = "as-say bad"; s3.textContent = (err && err.message) ? err.message : "That did not save."; }
    });
  }

  /* one delegated listener, so repainting never loses the wiring */
  /* The certification script workbook sits in the firm's own repository beside its engagements
     file, so it is read with the firm's own key, like everything else on this page. */
  function downloadScript(btn) {
    var row = btn.getAttribute("data-scriptdl");
    var e = list().filter(function (x) { return String(x.row) === String(row); })[0];
    var cs = e && e.certificationScript;
    if (!cs || !cs.file || !current) return;
    var label = btn.textContent;
    btn.disabled = true; btn.textContent = "Fetching\u2026";
    R.readRaw(current.key, cs.file).then(function (r) {
      var bin = atob(r.base64), bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var blob = new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (e.org + " " + e.program + " Certification Script.xlsx").replace(/[\\/:*?"<>|]+/g, " ");
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }).catch(function () {
      alert("The certification script could not be fetched just now. Try again in a minute, or email certifications@mismo.org.");
    }).then(function () { btn.disabled = false; btn.textContent = label; });
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var c;
    if ((c = t.closest("[data-open]"))) { open(c.getAttribute("data-open")); return; }
    if ((c = t.closest("[data-scriptdl]"))) { downloadScript(c); return; }
    if ((c = t.closest("[data-sectog]"))) {
      var id = c.getAttribute("data-sectog");
      openSecs[id] = !openSecs[id];
      drawPanel();
      return;
    }
    if ((c = t.closest("[data-qtog]"))) {
      var q = c.getAttribute("data-qtog");
      openQ[q] = !openQ[q];
      drawPanel();
      return;
    }
    if (t.closest("#as-wide")) { wide = !wide; drawPanel(); return; }
    if (t.closest("#as-shut") || t.closest("#as-scrim")) { shut(); return; }
    if ((t.closest("[data-rec]") || t.closest("[data-step]") || t.closest("[data-pnote]") || t.closest("[data-avadd]") || t.closest("[data-avdel]") || t.closest("[data-avsave]")) && !canEditFirm()) return;
    if ((c = t.closest("[data-rec]"))) { record(c.getAttribute("data-rec")); return; }
    if ((c = t.closest("[data-step]"))) { recordStep(c.getAttribute("data-step")); return; }
    if ((c = t.closest("[data-pnote]"))) { recordNote(c.getAttribute("data-pnote")); return; }
    if ((c = t.closest("[data-avadd]"))) { readAvailForm(); availDraft.windows.push({ day: "Monday", from: "10:00", to: "11:30" }); paint(); return; }
    if ((c = t.closest("[data-avdel]"))) { readAvailForm(); availDraft.windows.splice(+c.getAttribute("data-avdel"), 1); paint(); return; }
    if ((c = t.closest("[data-avsave]"))) { saveAvail(); return; }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && openRow != null) {
      var t = e.target;
      if (t && (t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
      shut();
    }
  });

  /* ---- starting up -------------------------------------------------------- */
  function start() {
    mine = whoCanISee();
    if (!mine.length) {
      el("rail").hidden = true;
      document.body.classList.add("as-noshell");
      el("as-out").hidden = false;
      el("as-main").innerHTML = '<div class="as-wrap"><div class="as-empty">' +
        "This account is signed in, but it does not hold an assessor key, so there is nothing " +
        "for it to show here.<br><br>If you assess certifications for MISMO and expected to see " +
        'your engagements, email <a href="mailto:certifications@mismo.org">MISMO Certifications</a>.' +
        "</div></div>";
      return;
    }

    el("rail").hidden = false;
    document.body.classList.remove("as-noshell");
    el("as-out").hidden = false;

    var pw = el("as-pickwrap");
    if (mine.length > 1) {
      pw.hidden = false;
      el("as-pick").innerHTML = mine.map(function (f) {
        return '<option value="' + esc(f.key) + '">' + esc(f.slug) + "</option>";
      }).join("");
      /* Label each firm with its own proper name, taken from its own file. */
      mine.forEach(function (f) {
        R.readOr(f.key, "engagements/" + f.slug + ".json", null).then(function (r) {
          var d = r && r.data ? r.data : r;
          var pick = el("as-pick");
          var opt = pick && pick.querySelector('option[value="' + f.key + '"]');
          if (opt && d && d.firm) opt.textContent = d.firm;
        })["catch"](function () {});
      });
      el("as-pick").addEventListener("change", function () {
        var k = this.value;
        var f = mine.filter(function (x) { return x.key === k; })[0];
        if (f) loadFirm(f);
      });
    } else {
      pw.hidden = true;
    }

    document.querySelectorAll(".hq nav button[data-hq]").forEach(function (b) {
      b.addEventListener("click", function () {
        document.querySelectorAll(".hq nav button[data-hq]").forEach(function (o) {
          o.removeAttribute("aria-current");
        });
        b.setAttribute("aria-current", "page");
        pane = b.getAttribute("data-hq");
        shut();
        paint();
      });
    });

    el("as-out").addEventListener("click", function () {
      try { R.signOut(); } catch (e) {}
      location.reload();
    });

    /* ?firm=falcon opens that firm's portal (the CMS's view of a firm, 31 Oct 2026) */
    var want = null;
    try { want = new URLSearchParams(location.search).get("firm"); } catch (e) {}
    var first = mine.filter(function (f) { return want && (f.slug === want || f.key === want); })[0] || mine[0];
    if (el("as-pick") && mine.length > 1) el("as-pick").value = first.key;
    loadFirm(first);
  }

  /* what the rail's search reads, and how it opens what it finds */
  window.__assessorBook = function () { return book; };
  window.__assessorOpen = function (row) { open(row); };

  /* December, every year, with no upkeep */
  if (new Date().getMonth() === 11) {
    document.documentElement.setAttribute("data-season", "december");
  }

  Promise.resolve(R.boot()).then(function () {
    if (R.signedIn()) start(); else gate("");
  })["catch"](function () { gate(""); });
})();
</script>

<script>
/* The rail: collapse, remember, search. Copied from the MISMO rail pattern;
   only gather() is this page's own. */
(function(){
  "use strict";
  const KEY='hq.rail.off';

  function set(off, remember){
    document.body.classList.toggle('railmini', !!off);
    const h=document.getElementById('rail-hide');
    if(h){ h.setAttribute('aria-expanded', off?'false':'true');
      h.setAttribute('aria-label', off?'Open the menu':'Narrow the menu');
      h.title = (off?'Open the menu':'Narrow the menu')+' (backslash)'; }
    if(off) close();
    if(remember!==false){ try{ localStorage.setItem(KEY, off?'1':'0'); }catch(e){} }
    setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 230);
  }
  function toggle(){ set(!document.body.classList.contains('railmini')); }

  function start(){
    let off=null;
    try{ const v=localStorage.getItem(KEY); if(v!==null) off=(v==='1'); }catch(e){}
    if(off===null) off = window.matchMedia('(max-width:900px)').matches;
    set(off, false);
    const h=document.getElementById('rail-hide'); if(h) h.addEventListener('click',toggle);
    const sc=document.getElementById('rail-scrim'); if(sc) sc.addEventListener('click',()=>set(true));
    const qb=document.getElementById('rail-qb');
    if(qb) qb.addEventListener('click',()=>{ set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q'); if(q) q.focus(); },230); });
    document.querySelectorAll('.hq nav button[data-hq]').forEach(b=>{
      b.addEventListener('click',()=>{
        if(window.matchMedia('(max-width:900px)').matches) set(true);
      });
    });
    wireFind();
  }

  document.addEventListener('keydown',e=>{
    const t=e.target;
    const typing = t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    if(e.key==='\\' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); toggle(); }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){
      e.preventDefault(); set(false);
      setTimeout(()=>{ const q=document.getElementById('rail-q');
        if(q){ q.focus(); q.select(); } }, 230);
    }
  });

  const HITS=()=>document.getElementById('rail-hits');
  let picked=-1, rows=[];
  function norm(x){ return String(x||'').replace(/\s+/g,' ').trim().toLowerCase(); }

  function gather(q){
    const t=norm(q); if(t.length<2) return [];
    const out=[];
    const score=(name)=>{ const n=norm(name);
      return n===t ? 3 : n.indexOf(t)===0 ? 2 : n.indexOf(t)>=0 ? 1 : 0; };
    const push=(group,name,where,go)=>{
      if(out.length<60) out.push({group,name,where,go,s:score(name)});
    };

    try{
      const B = window.__assessorBook ? window.__assessorBook() : null;
      ((B && B.engagements) || []).forEach(e=>{
        const hay = norm(e.org) + ' ' + norm(e.program) + ' ' + norm(e.product);
        if(hay.indexOf(t) < 0) return;
        push('Engagements', e.org,
          (e.program||'') + (e.product ? ' · ' + e.product : ''),
          ()=>{ go('open'); try{ window.__assessorOpen(e.row); }catch(err){} });
      });
    }catch(e){}

    const best={};
    out.forEach(h=>{ best[h.group]=Math.max(best[h.group]||0, h.s); });
    const ORDER=['Engagements'];
    out.sort((a,b)=>
      (best[b.group]-best[a.group])
      || (ORDER.indexOf(a.group)-ORDER.indexOf(b.group))
      || (b.s-a.s)
      || String(a.name).localeCompare(String(b.name)));
    return out;
  }
  function go(tab){
    const b=document.querySelector('.hq nav button[data-hq="'+tab+'"]');
    if(b && !b.hasAttribute('aria-current')) b.click();
  }

  function draw(list){
    const box=HITS(); if(!box) return;
    box.textContent=''; rows=[]; picked=-1;
    if(!list.length){
      const n=document.createElement('div'); n.className='rh-none';
      n.textContent='Nothing matches.'; box.appendChild(n); box.hidden=false; return;
    }
    let g=null;
    list.slice(0,24).forEach(h=>{
      if(h.group!==g){ g=h.group;
        const hd=document.createElement('div'); hd.className='rh-g'; hd.textContent=g; box.appendChild(hd); }
      const b=document.createElement('button'); b.type='button'; b.className='rh';
      const nm=document.createElement('b'); nm.textContent=h.name; b.appendChild(nm);
      if(h.where){ const w=document.createElement('i'); w.textContent=h.where; b.appendChild(w); }
      b.addEventListener('click',()=>{ close(); h.go(); });
      rows.push(b); box.appendChild(b);
    });
    box.hidden=false;
  }
  function close(){ const b=HITS(); if(b){ b.hidden=true; b.textContent=''; } rows=[]; picked=-1; }
  function mark(){ rows.forEach((r,i)=>r.classList.toggle('on', i===picked));
    if(rows[picked]) try{ rows[picked].scrollIntoView({block:'nearest'}); }catch(e){} }

  function wireFind(){
    const q=document.getElementById('rail-q'), x=document.getElementById('rail-qx');
    if(!q) return;
    let tmr=null;
    const run=()=>{ const v=q.value;
      if(x) x.hidden = !v;
      if(norm(v).length<2){ close(); return; }
      draw(gather(v)); };
    q.addEventListener('input',()=>{ clearTimeout(tmr); tmr=setTimeout(run,150); });
    q.addEventListener('focus',()=>{ if(norm(q.value).length>=2) run(); });
    q.addEventListener('keydown',e=>{
      if(e.key==='Escape'){ close(); q.blur(); return; }
      if(!rows.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); picked=(picked+1)%rows.length; mark(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); picked=(picked-1+rows.length)%rows.length; mark(); }
      else if(e.key==='Enter'){ e.preventDefault(); (rows[picked]||rows[0]).click(); }
    });
    if(x) x.addEventListener('click',()=>{ q.value=''; x.hidden=true; close(); q.focus(); });
    document.addEventListener('click',e=>{
      if(!e.target.closest('.railfind')) close();
    });
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
  window.__rail={ show:()=>set(false), hide:()=>set(true), toggle,
    mini:()=>document.body.classList.contains('railmini') };
})();
</script>

<script>
/* The theme toggle, sharing mismo.portal.theme with every other MISMO page. */
(function theme(){
  var btn = document.getElementById("theme-btn");
  if(!btn) return;
  function cur(){
    var t = document.documentElement.getAttribute("data-theme");
    if(t) return t;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function paint(){
    const dark = cur() === "dark";
    const lab = document.getElementById("theme-lab");
    if(lab) lab.textContent = dark ? "Light Mode" : "Dark Mode";
    else btn.textContent = dark ? "Light Mode" : "Dark Mode";
    btn.title = "Switch to " + (dark ? "light" : "dark") + " mode";
  }
  btn.addEventListener("click", function(){
    document.documentElement.setAttribute("data-theme", cur() === "dark" ? "light" : "dark");
    paint();
    try{ localStorage.setItem("mismo.portal.theme", cur()); }catch(e){}
    window.dispatchEvent(new Event("resize"));
  });
  try{
    var saved = localStorage.getItem("mismo.portal.theme");
    if(saved) document.documentElement.setAttribute("data-theme", saved);
  }catch(e){}
  paint();
})();
</script>
